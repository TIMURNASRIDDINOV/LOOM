<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LOOM — Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=7" />
  <link rel="stylesheet" href="assets/nav.css?v=3" />
  <link rel="stylesheet" href="assets/auth.css?v=4" />
  <link rel="stylesheet" href="assets/login-modal.css?v=3" />
  <script src="assets/boot.js?v=5"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body, sans-serif); -webkit-font-smoothing: antialiased; }
    .auth-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .auth-back { font-size: 0.78rem; color: var(--ink-55); text-decoration: none; transition: color 0.15s; }
    .auth-back:hover { color: var(--accent-deep); }
    .auth-btn-tg {
      width: 100%; padding: 0.85rem; border-radius: var(--radius); border: 1px solid #229ED9;
      background: #229ED9; color: #fff; font-family: inherit; font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 0.55rem; transition: background 0.2s, border-color 0.2s;
    }
    .auth-btn-tg:hover { background: #1b8ec2; border-color: #1b8ec2; }
    .auth-tg-hint { font-size: 0.74rem; color: var(--ink-38); text-align: center; margin: 0.65rem 0 0; line-height: 1.5; }
    .auth-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0; color: var(--ink-38); font-size: 0.72rem; letter-spacing: 0.06em; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-topbar">
      <a href="index.html" class="auth-back" data-i18n="nav.backToStore">← Вернуться на сайт</a>
      <div class="lang-switcher-mount"></div>
    </div>
    <a href="index.html" class="auth-logo">LOOM<span class="slash">/</span></a>

    <h1 class="auth-title" data-i18n="auth.regTitle">Создать аккаунт</h1>
    <p class="auth-subtitle" data-i18n="auth.regSub">Отслеживайте заказы и сохраняйте дизайны</p>

    <button type="button" class="auth-btn-tg" id="tgAuthBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.27c-.2-.16-.46-.2-.7-.12L2.6 11.4c-.5.2-.5.9.01 1.07l4.7 1.5 1.8 5.6c.16.5.8.62 1.13.22l2.6-3.16 4.9 3.6c.36.27.88.07.97-.38l3.4-15.2c.06-.27-.04-.5-.27-.66zM9.3 14.2l-.5 3.5-1.2-4 9.3-6-7.6 6.5z"/></svg>
      <span data-i18n="auth.viaTelegram">Продолжить через Telegram</span>
    </button>
    <p class="auth-tg-hint" data-i18n="auth.tgHint">Подтвердим ваш номер через Telegram — быстро и без пароля.</p>

    <div class="auth-divider"><span data-i18n="auth.orEmail">или по email</span></div>

    <div class="auth-banner" id="authBanner"></div>

    <form id="registerForm" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="emailInput"><span data-i18n="auth.email">Email</span> <span style="color:#d6382d">*</span></label>
        <input
          type="email"
          id="emailInput"
          class="auth-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <p class="auth-error" id="emailError"></p>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="passwordInput"><span data-i18n="auth.password">Пароль</span> <span style="color:#d6382d">*</span></label>
        <input
          type="password"
          id="passwordInput"
          class="auth-input"
          placeholder="Минимум 8 символов"
          data-i18n-attr="placeholder:auth.pwMin8"
          autocomplete="new-password"
          required
        />
        <p class="auth-error" id="passwordError"></p>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="nameInput" data-i18n="auth.name">Имя</label>
        <input
          type="text"
          id="nameInput"
          class="auth-input"
          placeholder="Необязательно"
          data-i18n-attr="placeholder:order.optional"
          autocomplete="name"
          maxlength="80"
        />
      </div>

      <div class="auth-field">
        <label class="auth-label" for="phoneInput" data-i18n="auth.phone">Телефон</label>
        <input
          type="tel"
          id="phoneInput"
          class="auth-input"
          placeholder="+998 90 123-45-67"
          autocomplete="tel"
          maxlength="20"
        />
      </div>

      <button type="submit" class="auth-btn" id="submitBtn" data-i18n="auth.regBtn">Зарегистрироваться</button>
    </form>

    <p class="auth-footer">
      <span data-i18n="auth.haveAccount">Уже есть аккаунт?</span> <a href="login.html" data-i18n="auth.loginBtn">Войти</a>
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/config.js?v=2"></script>
  <script src="assets/i18n.js?v=7"></script>
  <script src="assets/auth.js?v=3"></script>
  <script src="assets/motion.js?v=6"></script>
  <script src="assets/login-modal.js?v=2"></script>
  <script>
    'use strict';
    (function () {
      // Redirect if already logged in
      window.LOOM_AUTH.getCurrentUser().then(function (user) {
        if (user) window.location.href = 'account.html';
      });

      const T = (k, fb) => { try { return (window.LOOM_I18N ? window.LOOM_I18N.t(k) : fb) || fb; } catch (e) { return fb; } };

      // Primary path: verify phone via Telegram (guarantees a real number)
      const tgBtn = document.getElementById('tgAuthBtn');
      if (tgBtn && window.LOOM_LOGIN_MODAL) {
        tgBtn.addEventListener('click', async function () {
          try {
            const user = await window.LOOM_LOGIN_MODAL.open();
            if (user) {
              const redirect = new URLSearchParams(window.location.search).get('redirect') || 'account.html';
              window.location.href = redirect;
            }
          } catch (e) { /* cancelled */ }
        });
      }

      const form      = document.getElementById('registerForm');
      const emailIn   = document.getElementById('emailInput');
      const passIn    = document.getElementById('passwordInput');
      const nameIn    = document.getElementById('nameInput');
      const phoneIn   = document.getElementById('phoneInput');
      const submitBtn = document.getElementById('submitBtn');
      const banner    = document.getElementById('authBanner');
      const emailErr  = document.getElementById('emailError');
      const passErr   = document.getElementById('passwordError');

      function showBanner(msg, type) {
        banner.textContent = msg;
        banner.className = 'auth-banner ' + type;
      }

      function clearErrors() {
        emailErr.textContent = '';
        passErr.textContent  = '';
        emailIn.classList.remove('error');
        passIn.classList.remove('error');
        banner.className = 'auth-banner';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        const email    = emailIn.value.trim();
        const password = passIn.value;
        const name     = nameIn.value.trim();
        const phone    = phoneIn.value.trim();
        let valid = true;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailErr.textContent = T('auth.errEmail', 'Введите корректный email');
          emailIn.classList.add('error');
          valid = false;
        }
        if (!password || password.length < 8) {
          passErr.textContent = T('auth.errPwLen', 'Пароль должен содержать минимум 8 символов');
          passIn.classList.add('error');
          valid = false;
        }
        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = T('auth.registering', 'Регистрация…');

        try {
          await window.LOOM_AUTH.register(email, password, name || undefined, phone || undefined);
          window.location.href = 'account.html';
        } catch (err) {
          showBanner(err.message || 'Ошибка регистрации', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = T('auth.regBtn', 'Зарегистрироваться');
        }
      });
    })();
  </script>
</body>
</html>
