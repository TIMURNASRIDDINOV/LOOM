<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>LOOM — Market</title>
  <meta name="description" content="Работы независимых дизайнеров Узбекистана. Выберите принт, примерьте его в 3D и закажите." />
  <link rel="canonical" href="https://loomdesign.uz/market" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LOOM" />
  <meta property="og:title" content="LOOM — Маркет дизайнеров" />
  <meta property="og:description" content="Работы независимых дизайнеров Узбекистана. Выберите принт и примерьте его в 3D." />
  <meta property="og:url" content="https://loomdesign.uz/market" />
  <meta property="og:image" content="https://loomdesign.uz/images/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/atelye.css?v=1" />
  <script src="assets/boot.js?v=10"></script>
  <style>
    /* Market only. Components come from assets/atelye.css. */
    .atl-mk-top { display: flex; flex-direction: column; gap: 10px; }
    /* Print card: the art and title open the print in the configurator;
       the author link sits outside the button (no nested controls). */
    .atl-mk-try { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; text-align: left; border-radius: var(--r-panel); }
    .atl-mk-try:hover .atl-pc-nm { text-decoration: underline; text-underline-offset: 3px; }
    .atl-mk-try .atl-gtile { padding: 16%; }
    .atl-mk-skl { height: 14px; width: 70%; }
    .atl-mk-none { grid-column: 1 / -1; }
    .atl-mk-by { align-self: flex-start; min-height: 44px; min-width: 44px; margin-top: -10px; display: inline-flex; align-items: center; text-decoration: none; overflow-wrap: anywhere; }
    .atl-mk-by:hover { text-decoration: underline; }
    .atl-mk-cerr { align-self: center; white-space: nowrap; }
    .atl-mk-more { align-self: center; min-width: 200px; }
    .atl-warn:empty { display: none; }
  </style>
</head>
<body data-page="market" data-title="Market" data-back="index.html">
  <main class="atl-wrap">
    <div class="atl-mk-top">
      <h1 class="atl-t1" data-i18n="atl.nav.market">Market</h1>
      <p class="atl-lead" data-i18n="atl.mkt.lead">Mustaqil dizaynerlarning ishlari. Printni tanlang — u konstruktorda ochiladi, muallif har sotuvdan ulush oladi.</p>
    </div>

    <!-- Categories from GET /api/artwork-categories (assets/market.js). -->
    <div class="atl-chips" id="mk-cats" role="group" aria-label="Kategoriya" data-i18n-attr="aria-label:cat.label" hidden></div>

    <div class="atl-pgrid" id="mk-grid" aria-live="polite"></div>

    <!-- The market has no approved prints yet: invite designers. -->
    <div class="atl-empty" id="mk-empty" hidden>
      <span class="atl-cv" aria-hidden="true"><svg class="atl-ic" viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M5 9v11h14V9M4 9h16"/></svg></span>
      <h2 class="atl-t2" data-i18n="atl.mkt.emptyT">Hozircha bo‘sh. Birinchi bo‘ling.</h2>
      <p class="atl-lead" data-i18n="atl.mkt.emptyL">Ishingizni yuklang — tekshiramiz, shu yerda ko‘rsatamiz, har sotuvdan ustamangizning 70% sizga.</p>
      <div class="atl-btns">
        <a class="atl-btn atl-btn-g" href="designers.html" data-i18n="atl.foot.becomeDesigner">Dizayner bo‘lish</a>
      </div>
    </div>

    <p class="atl-warn" id="mk-err" role="alert"></p>
    <button type="button" class="atl-btn atl-mk-more" id="mk-more" data-i18n="mk.loadMore" hidden>Yana ko‘rsatish</button>
  </main>

  <script src="assets/config.js?v=9"></script>
  <script src="assets/i18n.js?v=58"></script>
  <script src="assets/auth.js?v=6"></script>
  <script src="assets/tma.js?v=5"></script>
  <script src="assets/shell.js?v=1"></script>
  <script src="assets/market.js?v=6"></script>
  <script src="assets/track.js?v=6"></script>
  <script src="assets/analytics.js?v=4"></script>
</body>
</html>
