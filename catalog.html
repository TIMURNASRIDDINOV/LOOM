<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2ed" />
  <title>LOOM — Каталог</title>
  <meta name="description" content="Каталог LOOM: футболки, худи, поло и другая одежда под кастомизацию." />

  <!-- SEO -->
  <link rel="canonical" href="https://loomdesign.uz/catalog" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LOOM" />
  <meta property="og:title" content="LOOM — Каталог" />
  <meta property="og:description" content="Каталог LOOM: футболки, худи, поло и другая одежда под кастомизацию." />
  <meta property="og:url" content="https://loomdesign.uz/catalog" />
  <meta property="og:image" content="https://loomdesign.uz/images/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Design system + catalog cards -->
  <link rel="stylesheet" href="assets/theme.css?v=12" />
  <link rel="stylesheet" href="assets/nav.css?v=12" />
  <link rel="stylesheet" href="assets/auth.css?v=12" />
  <link rel="stylesheet" href="assets/login-modal.css?v=5" />
  <link rel="stylesheet" href="products-catalog.css?v=7" />

  <!-- Pre-paint guard -->
  <script src="assets/boot.js?v=8" data-intro></script>

  <!-- Page scripts: deferred, document order preserved (GSAP → motion.js,
       config → layout → i18n → auth → nav → cart → catalog renderer). -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script defer src="assets/config.js?v=2"></script>
  <script defer src="assets/layout.js?v=3"></script>
  <script defer src="assets/i18n.js?v=19"></script>
  <script defer src="assets/auth.js?v=4"></script>
  <script defer src="assets/tma.js?v=3"></script>
  <script defer src="assets/nav.js?v=2"></script>
  <script defer src="assets/motion.js?v=9"></script>
  <script defer src="assets/track.js?v=3"></script>
  <script defer src="assets/login-modal.js?v=2"></script>
  <script defer src="assets/cart.js?v=2"></script>
  <script defer src="products-catalog.js?v=8"></script>

  <style>
    /* ============================================================
       CATALOG — page-specific layout only; tokens from theme.css
    ============================================================ */
    .catalog-hero {
      padding: calc(var(--nav-h) + clamp(3.5rem, 8vw, 6rem)) 0 clamp(2.5rem, 6vw, 4rem);
    }
    .catalog-hero__eyebrow { display: block; margin-bottom: 1.4rem; }
    .catalog-hero__title { max-width: 14ch; }
    .catalog-hero__title .line { display: block; }
    .catalog-hero__meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-top: clamp(1.8rem, 4vw, 2.8rem);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-38);
    }
    .catalog-products { padding-bottom: var(--sect-y); }
    @media (max-width: 620px) {
      /* two long mono spans can't share one row at 375px */
      .catalog-hero__meta span:last-child { display: none; }
    }
  </style>
</head>
<body data-page="catalog" data-preloader data-cart>
  <!-- Header + footer injected by assets/layout.js -->

  <!-- ============================================================
       HERO
  ============================================================ -->
  <header class="catalog-hero">
    <div class="container">
      <span class="catalog-hero__eyebrow eyebrow">LOOM<span class="slash">/</span> Catalog</span>
      <h1 class="catalog-hero__title h2" data-reveal="mask">
        <span class="line" data-i18n="catalog.heroTitle">Исследуйте нашу коллекцию</span>
      </h1>
      <div class="catalog-hero__meta" data-reveal>
        <span data-i18n="catalog.heroSubtitle">Интерактивный 3D просмотр модели</span>
        <span>Apparel · 01—09</span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       PRODUCTS — rendered from the API by products-catalog.js
  ============================================================ -->
  <section class="catalog-products" id="products">
    <div class="container">
      <div id="product-list-root"></div>
    </div>
  </section>

  <!-- Scripts are deferred from <head>; auth.js is not available until
       the defer queue drains. -->
  <script>document.addEventListener('DOMContentLoaded',function(){window.LOOM_AUTH&&window.LOOM_AUTH.renderAuthNav()})</script>
</body>
</html>
