<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOOM - Каталог 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- React CDN -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <!-- Three.js CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <!-- Product Catalog CSS -->
    <link rel="stylesheet" href="products-catalog.css" />
    <!-- Auth styles -->
    <link rel="stylesheet" href="assets/auth.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* ============================================================
         CATALOG — dark visual system matching index.html
      ============================================================ */
      :root {
        --bg: #080808;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.45);
        --hairline: rgba(255,255,255,0.08);
        --panel: #0f0f0f;
        --brand: #0a84ff;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --mono: 'DM Mono', monospace;
      }

      *, *::before, *::after {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html { scroll-behavior: smooth; }

      body {
        background: var(--bg);
        color: var(--text);
      }

      /* ── Navigation ─────────────────────────────────────────── */
      .nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        min-height: 64px;
        background: rgba(8,8,8,0.72);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        z-index: 200;
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
        overflow: visible;
      }
      .nav-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 64px;
      }
      .nav-brand {
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: #fff;
        text-transform: uppercase;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 2rem;
        margin-right: 0;
      }
      .nav-link {
        color: rgba(255,255,255,0.55);
        text-decoration: none;
        font-weight: 400;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        padding: 0.4rem 0;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 200ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-link:hover, .nav-link.active { color: #fff; }
      .nav-link.active { position: relative; }
      .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: -2px; left: 0; right: 0;
        height: 1.5px;
        background: #fff;
        border-radius: 1px;
      }
      .nav-link:focus, .nav-link:focus-visible { outline: none; }
      .link-underline-center::after { display: none; }
      .nav-icon { width: 16px; height: 16px; opacity: 0.7; }
      .nav-hamburger {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px; height: 40px;
        background: transparent;
        border: none;
        cursor: pointer;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
        z-index: 210;
      }
      .nav-hamburger svg { width: 22px; height: 22px; }
      @media (min-width: 768px) { .nav-hamburger { display: none; } }
      @media (min-width: 768px) { .nav-links { gap: 1.75rem; } }
      @media (max-width: 767px) { .nav-links { display: none; } }

      /* ── Nav CTA ─────────────────────────────────────────────── */
      .nav-cta {
        display: inline-flex;
        align-items: center;
        padding: 0.52rem 1.1rem;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.55);
        border-radius: 3px;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        flex-shrink: 0;
      }
      .nav-cta:hover { background: #fff; color: #0a0a0a; border-color: #fff; }
      @media (max-width: 767px) { .nav-cta { display: none; } }

      /* ── Mobile Menu ─────────────────────────────────────────── */
      .mobile-backdrop {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 90;
        opacity: 0; visibility: hidden;
        transition: opacity 200ms ease, visibility 200ms ease;
      }
      .mobile-backdrop.active { opacity: 1; visibility: visible; }
      .mobile-menu {
        position: fixed;
        top: 0; right: 0;
        width: 300px; max-width: 80vw;
        height: 100%;
        background: rgba(10,10,10,0.97);
        backdrop-filter: blur(20px);
        border-left: 0.5px solid rgba(255,255,255,0.08);
        z-index: 100;
        transform: translateX(100%);
        transition: transform 300ms cubic-bezier(0.4,0,0.2,1);
        display: flex;
        flex-direction: column;
      }
      .mobile-menu.active { transform: translateX(0); }
      .mobile-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
        min-height: 64px;
        flex-shrink: 0;
      }
      .mobile-menu-brand {
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: #fff;
        text-transform: uppercase;
      }
      .mobile-menu-close {
        display: flex; align-items: center; justify-content: center;
        width: 32px; height: 32px;
        background: transparent; border: none;
        cursor: pointer;
        color: rgba(255,255,255,0.6);
        border-radius: 4px;
        transition: background 200ms ease, color 200ms ease;
        padding: 0;
      }
      .mobile-menu-close:hover { background: rgba(255,255,255,0.08); color: #fff; }
      .mobile-menu-close svg { width: 20px; height: 20px; }
      .mobile-menu-links { display: flex; flex-direction: column; padding: 0.5rem 0; flex: 1; }
      .mobile-menu-link {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 1rem 1.5rem;
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        font-weight: 400; font-size: 0.9rem;
        border-bottom: 0.5px solid rgba(255,255,255,0.06);
        transition: background 200ms ease, color 200ms ease;
      }
      .mobile-menu-link:hover { background: rgba(255,255,255,0.04); color: #fff; }
      .mobile-menu-link.active { color: #fff; background: rgba(255,255,255,0.06); font-weight: 500; }
      .mobile-menu-link svg { width: 18px; height: 18px; opacity: 0.7; }
      body.menu-open { overflow: hidden; }
      @media (min-width: 768px) { .mobile-menu, .mobile-backdrop { display: none !important; } }

      /* ── Fixed background ───────────────────────────────────────── */
      .fixed-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        background: url('images/backgroundphoto.jpg') center / cover no-repeat;
      }

      /* ── Catalog Hero ─────────────────────────────────────────── */
      .catalog-hero {
        background: rgba(8,8,8,0.45);
        min-height: 38vh;
        position: relative; z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 1.75rem 60px;
        text-align: center;
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
      }
      .catalog-hero h1 {
        font-size: clamp(2rem, 4.5vw, 3.2rem);
        font-weight: 300;
        color: #fff;
        line-height: 1.1;
        letter-spacing: -0.025em;
        margin: 0 0 0.9rem;
      }
      .catalog-hero p {
        font-size: 1rem;
        color: rgba(255,255,255,0.45);
        margin: 0;
        font-weight: 300;
      }

      /* ── Layout ──────────────────────────────────────────────── */
      .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.75rem; }

      .section { padding: 5rem 0; background: rgba(8,8,8,0.92); position: relative; z-index: 1; }

      .section-title {
        font-size: clamp(1.8rem, 3.5vw, 2.4rem);
        font-weight: 300;
        text-align: center;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
        color: #fff;
      }
      .section-subtitle {
        font-size: 0.95rem;
        color: rgba(255,255,255,0.45);
        text-align: center;
        margin-bottom: 3rem;
        max-width: 560px;
        margin-left: auto; margin-right: auto;
        font-weight: 300;
      }

      /* ── Feature grid ───────────────────────────────────────── */
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0;
        max-width: 1200px; margin: 0 auto;
        border: 0.5px solid rgba(255,255,255,0.08);
      }
      .feature-card {
        padding: 2rem 1.75rem;
        background: #0f0f0f;
        border: none;
        border-right: 0.5px solid rgba(255,255,255,0.08);
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
        text-align: left;
        transition: background 250ms ease;
      }
      .feature-card:hover { background: #141414; }
      .feature-icon { font-size: 1.4rem; margin-bottom: 1rem; display: block; opacity: 0.8; }
      .feature-title { font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: 0.45rem; letter-spacing: -0.01em; }
      .feature-text { font-size: 0.85rem; color: rgba(255,255,255,0.5); line-height: 1.6; font-weight: 300; }

      /* ── Configurator section ───────────────────────────────── */
      .configurator-section { background: #0a0a0a; padding: 5rem 0; }
      .configurator-card {
        max-width: 880px; margin: 0 auto;
        background: #0f0f0f;
        border-radius: 4px;
        padding: 2rem;
        border: 0.5px solid rgba(255,255,255,0.08);
        text-align: center;
      }
      .configurator-preview {
        background: #1a1a1a;
        border-radius: 4px;
        border: 0.5px solid rgba(255,255,255,0.08);
        margin-bottom: 1.5rem;
        height: 280px;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .configurator-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

      /* ── 3D model viewer (unused in catalog but keep classes) ─ */
      .model-viewer-container {
        position: relative; width: 100%; max-width: 550px; height: 600px;
        background: #111; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #model-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
      #model-canvas:active { cursor: grabbing; }
      .model-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.6); font-size: 0.9rem; }
      @keyframes fadeInHint { to { opacity: 1; } }
      .model-controls-hint {
        position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
        color: rgba(255,255,255,0.9); padding: 0.5rem 1rem;
        border-radius: 0; font-size: 0.82rem;
        border: 0.5px solid rgba(255,255,255,0.15);
        z-index: 2; pointer-events: none; opacity: 0;
        animation: fadeInHint 0.5s ease 1s forwards;
      }

      /* ── Buttons ─────────────────────────────────────────────── */
      .btn-primary, .btn-outline {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.45);
        border-radius: 2px;
        padding: 0.8rem 1.8rem;
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      .btn-primary:hover, .btn-outline:hover { background: #fff; color: #111; border-color: #fff; }

      /* ── Product card dark overrides (over products-catalog.css) */
      .product-grid .product-card {
        background: #0f0f0f !important;
        border: 0.5px solid rgba(255,255,255,0.08) !important;
        border-radius: 4px !important;
        box-shadow: none !important;
      }
      .product-grid .product-card:hover {
        background: #141414 !important;
        border-color: rgba(255,255,255,0.15) !important;
        transform: none !important;
        box-shadow: none !important;
      }
      .product-grid .product-card__image-container {
        background: #0a0a0a !important;
      }
      .product-grid .product-card__title { color: #fff !important; }
      .product-grid .product-card__description { color: rgba(255,255,255,0.5) !important; }
      .product-grid .product-card__price { color: rgba(255,255,255,0.8) !important; }
      .product-card .customize-btn.btn-primary {
        background: transparent !important;
        color: #fff !important;
        border: 1px solid rgba(255,255,255,0.45) !important;
        border-radius: 2px !important;
        box-shadow: none !important;
      }
      .product-card .customize-btn.btn-primary:hover {
        background: #fff !important;
        color: #111 !important;
        border-color: #fff !important;
        transform: none !important;
        box-shadow: none !important;
      }
      .product-card .customize-btn.btn-disabled {
        background: rgba(255,255,255,0.06) !important;
        color: rgba(255,255,255,0.3) !important;
        border: 0.5px solid rgba(255,255,255,0.1) !important;
      }

      /* ── Footer ──────────────────────────────────────────────── */
      .site-footer { display: none; }

      .footer {
        background: #080808;
        border-top: 1px solid rgba(255,255,255,0.07);
        padding: 2rem 1.75rem;
        position: relative; z-index: 1;
      }
      .footer__inner {
        max-width: 1280px; margin: 0 auto;
        display: flex; align-items: center;
        justify-content: space-between;
        flex-wrap: wrap; gap: 1rem;
      }
      .footer__copy {
        font-family: var(--mono); font-size: 0.65rem;
        letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
      }
      .footer__links { display: flex; gap: 1.75rem; align-items: center; }
      .footer__link {
        font-size: 0.78rem; font-weight: 300;
        color: rgba(255,255,255,0.35); text-decoration: none;
        transition: color 200ms ease;
      }
      .footer__link:hover { color: #fff; }
      .footer__location {
        font-family: var(--mono); font-size: 0.65rem;
        letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
      }
      @media (max-width: 640px) {
        .footer__inner { flex-direction: column; align-items: flex-start; }
      }

      /* old footer classes (unused) */
      .footer-grid, .footer-column, .footer-heading,
      .footer-links, .footer-tagline, .footer-contact,
      .footer-logo, .contact-item, .social-links,
      .social-icon, .newsletter, .newsletter-form,
      .footer-bottom, .legal-links { display: none; }
        padding: 4rem 0 2rem;
        border-top: 0.5px solid rgba(255,255,255,0.08);
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1.5fr;
        gap: 3rem;
        max-width: 1200px;
        margin: 0 auto 3rem;
        padding: 0 1.75rem;
      }
      .footer-logo {
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 0.9rem;
      }
      .footer-tagline { font-size: 0.83rem; color: rgba(255,255,255,0.4); margin-bottom: 1.2rem; line-height: 1.6; font-weight: 300; }
      .footer-contact { display: flex; flex-direction: column; gap: 0.65rem; }
      .contact-item { display: flex; align-items: center; gap: 0.6rem; color: rgba(255,255,255,0.45); text-decoration: none; font-size: 0.83rem; transition: color 200ms ease; }
      .contact-item:hover { color: #fff; }
      .contact-item .icon { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }
      .footer-heading { font-family: var(--mono); font-size: 0.62rem; font-weight: 400; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 1rem; }
      .footer-links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
      .footer-links a { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.83rem; font-weight: 300; transition: color 200ms ease; }
      .footer-links a:hover { color: rgba(255,255,255,0.8); }
      .social-links { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
      .social-icon { width: 20px; height: 20px; color: rgba(255,255,255,0.35); transition: color 200ms ease; }
      .social-links a:hover .social-icon { color: #fff; }
      .newsletter-form { display: flex; gap: 0.5rem; }
      .newsletter-form input {
        flex: 1; padding: 0.65rem 0.9rem;
        background: rgba(255,255,255,0.05);
        border: 0.5px solid rgba(255,255,255,0.12);
        border-radius: 2px; color: #fff; font-size: 0.82rem;
        font-family: inherit; outline: none;
        transition: border-color 200ms ease;
      }
      .newsletter-form input::placeholder { color: rgba(255,255,255,0.3); }
      .newsletter-form input:focus { border-color: rgba(255,255,255,0.4); }
      .newsletter-form button {
        padding: 0.65rem 0.9rem;
        background: transparent;
        border: 0.5px solid rgba(255,255,255,0.45);
        border-radius: 2px;
        color: #fff; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.3s ease, color 0.3s ease;
      }
      .newsletter-form button:hover { background: #fff; color: #111; }
      .footer-bottom {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5rem 1.75rem 0;
        border-top: 0.5px solid rgba(255,255,255,0.08);
        font-size: 0.75rem; color: rgba(255,255,255,0.3);
        max-width: 1200px; margin: 0 auto;
        flex-wrap: wrap; gap: 0.75rem;
      }
      .legal-links { display: flex; gap: 1.5rem; }
      .legal-links a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 200ms ease; }
      .legal-links a:hover { color: rgba(255,255,255,0.7); }

      /* ── Responsive ──────────────────────────────────────────── */
      @media (max-width: 900px) {
        .footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem; }
      }
      @media (max-width: 640px) {
        .footer-grid { grid-template-columns: 1fr; gap: 1.75rem; }
        .footer-bottom { flex-direction: column; align-items: flex-start; }
        .catalog-hero { min-height: 30vh; padding: 110px 1.25rem 40px; }
      }
      @media (max-width: 768px) {
        .feature-grid { grid-template-columns: 1fr; }
        .section { padding: 4rem 0; }
      }
    </style>
  </head>
  <body>
    <div class="fixed-bg"></div>
    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-content">
        <a href="index.html" class="nav-brand">LOOM</a>
        <!-- Desktop Navigation Links -->
        <div class="nav-links">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link active">Каталог</a>
          <a href="configurator.html" class="nav-link">Кастомизация</a>
        </div>
        <a href="configurator.html" class="nav-cta">Создать дизайн</a>
        <div class="auth-nav-slot"></div>
        <!-- Hamburger Button (Mobile) -->
        <button
          class="nav-hamburger"
          id="menuToggle"
          aria-label="Открыть меню навигации"
          aria-expanded="false"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </nav>

    <!-- Mobile Menu Backdrop -->
    <div class="mobile-backdrop" id="mobileBackdrop"></div>

    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <div class="mobile-menu-header">
        <span class="mobile-menu-brand">LOOM</span>
        <button
          class="mobile-menu-close"
          id="menuClose"
          aria-label="Закрыть меню"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="mobile-menu-links">
        <a href="index.html" class="mobile-menu-link">
          <i data-lucide="home"></i>
          Главная
        </a>
        <a href="catalog.html" class="mobile-menu-link active">
          <i data-lucide="grid-3x3"></i>
          Каталог
        </a>
        <a href="configurator.html" class="mobile-menu-link">
          <i data-lucide="palette"></i>
          Кастомизация
        </a>
      </div>
    </div>

    <!-- Catalog Hero Section -->
    <section class="catalog-hero">
      <div class="container">
        <h1>Исследуйте нашу коллекцию</h1>
        <p>Интерактивный 3D просмотр модели</p>
      </div>
    </section>

    <!-- Products Section -->
    <section class="section" id="products">
      <!-- Product List (Vanilla JS) -->
      <div id="product-list-root"></div>
    </section>

    <!-- Features Section -->
    <section class="section">

    <script>
      (function () {
        const observer = new IntersectionObserver(
          (entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const el = entry.target;
                el.style.transition =
                  "transform 500ms ease, opacity 500ms ease";
                el.style.opacity = "1";
                el.style.transform = "translateY(0)";
                obs.unobserve(el);
              }
            });
          },
          { threshold: 0.12 }
        );

        const selectors = [
          ".feature-card",
          ".product-card",
          ".configurator-card",
          ".model-viewer-container",
        ];
        selectors.forEach((sel) => {
          document.querySelectorAll(sel).forEach((el) => {
            el.style.opacity = "0";
            el.style.transform = "translateY(12px)";
            observer.observe(el);
          });
        });

        const root = document.getElementById("product-list-root");
        if (root) {
          const mo = new MutationObserver(() => {
            document.querySelectorAll(".product-card").forEach((el) => {
              if (!el.dataset.revealInit) {
                el.dataset.revealInit = "1";
                el.style.opacity = "0";
                el.style.transform = "translateY(12px)";
                observer.observe(el);
              }
            });
          });
          mo.observe(root, { childList: true, subtree: true });
        }
      })();
    </script>

    <!-- Mobile Navigation Script -->
    <script>
      (function () {
        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }

        const menuToggle = document.getElementById("menuToggle");
        const menuClose = document.getElementById("menuClose");
        const mobileMenu = document.getElementById("mobileMenu");
        const mobileBackdrop = document.getElementById("mobileBackdrop");

        if (!menuToggle || !mobileMenu) return;

        function openMenu() {
          mobileMenu.classList.add("active");
          mobileBackdrop.classList.add("active");
          document.body.classList.add("menu-open");
          menuToggle.setAttribute("aria-expanded", "true");
          mobileMenu.setAttribute("aria-hidden", "false");
          const firstLink = mobileMenu.querySelector(".mobile-menu-link");
          if (firstLink) firstLink.focus();
        }

        function closeMenu() {
          mobileMenu.classList.remove("active");
          mobileBackdrop.classList.remove("active");
          document.body.classList.remove("menu-open");
          menuToggle.setAttribute("aria-expanded", "false");
          mobileMenu.setAttribute("aria-hidden", "true");
          menuToggle.focus();
        }

        menuToggle.addEventListener("click", openMenu);
        if (menuClose) menuClose.addEventListener("click", closeMenu);
        if (mobileBackdrop) mobileBackdrop.addEventListener("click", closeMenu);

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && mobileMenu.classList.contains("active")) {
            closeMenu();
          }
        });

        mobileMenu
          .querySelectorAll(".mobile-menu-link")
          .forEach(function (link) {
            link.addEventListener("click", closeMenu);
          });

        window.addEventListener("resize", function () {
          if (
            window.innerWidth >= 768 &&
            mobileMenu.classList.contains("active")
          ) {
            closeMenu();
          }
        });
      })();
    </script>
