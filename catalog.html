    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <!-- Three.js CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <!-- Product Catalog CSS -->
    <link rel="stylesheet" href="products-catalog.css" />
    <!-- Auth styles -->
    <link rel="stylesheet" href="assets/auth.css" />
    <link rel="stylesheet" href="assets/nav.css?v=1" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* ============================================================
         CATALOG — dark visual system matching index.html
      ============================================================ */
      :root {
        --bg: #080808;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.45);
        --hairline: rgba(255,255,255,0.08);
        --panel: #0f0f0f;
        --brand: #0a84ff;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --mono: 'DM Mono', monospace;
      }

      *, *::before, *::after {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      html { scroll-behavior: smooth; }

      body {
        background: var(--bg);
        color: var(--text);
      }


      /* ── Fixed background ───────────────────────────────────────── */
      .fixed-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        background: url('images/backgroundphoto.jpg') center / cover no-repeat;
      }

      /* ── Catalog Hero ─────────────────────────────────────────── */
      .catalog-hero {
        background: rgba(8,8,8,0.45);
        min-height: 38vh;
        position: relative; z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 1.75rem 60px;
        text-align: center;
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
      }
      .catalog-hero h1 {
        font-size: clamp(2rem, 4.5vw, 3.2rem);
        font-weight: 300;
        color: #fff;
        line-height: 1.1;
        letter-spacing: -0.025em;
        margin: 0 0 0.9rem;
      }
      .catalog-hero p {
        font-size: 1rem;
        color: rgba(255,255,255,0.45);
        margin: 0;
        font-weight: 300;
      }

      /* ── Layout ──────────────────────────────────────────────── */
      .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.75rem; }

      .section { padding: 5rem 0; background: rgba(8,8,8,0.92); position: relative; z-index: 1; }

      .section-title {
        font-size: clamp(1.8rem, 3.5vw, 2.4rem);
        font-weight: 300;
        text-align: center;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
        color: #fff;
      }
      .section-subtitle {
        font-size: 0.95rem;
        color: rgba(255,255,255,0.45);
        text-align: center;
        margin-bottom: 3rem;
        max-width: 560px;
        margin-left: auto; margin-right: auto;
        font-weight: 300;
      }

      /* ── Feature grid ───────────────────────────────────────── */
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0;
        max-width: 1200px; margin: 0 auto;
        border: 0.5px solid rgba(255,255,255,0.08);
      }
      .feature-card {
        padding: 2rem 1.75rem;
        background: #0f0f0f;
        border: none;
        border-right: 0.5px solid rgba(255,255,255,0.08);
        border-bottom: 0.5px solid rgba(255,255,255,0.08);
        text-align: left;
        transition: background 250ms ease;
      }
      .feature-card:hover { background: #141414; }
      .feature-icon { font-size: 1.4rem; margin-bottom: 1rem; display: block; opacity: 0.8; }
      .feature-title { font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: 0.45rem; letter-spacing: -0.01em; }
      .feature-text { font-size: 0.85rem; color: rgba(255,255,255,0.5); line-height: 1.6; font-weight: 300; }

      /* ── Configurator section ───────────────────────────────── */
      .configurator-section { background: #0a0a0a; padding: 5rem 0; }
      .configurator-card {
        max-width: 880px; margin: 0 auto;
        background: #0f0f0f;
        border-radius: 4px;
        padding: 2rem;
        border: 0.5px solid rgba(255,255,255,0.08);
        text-align: center;
      }
      .configurator-preview {
        background: #1a1a1a;
        border-radius: 4px;
        border: 0.5px solid rgba(255,255,255,0.08);
        margin-bottom: 1.5rem;
        height: 280px;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .configurator-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

      /* ── 3D model viewer (unused in catalog but keep classes) ─ */
      .model-viewer-container {
        position: relative; width: 100%; max-width: 550px; height: 600px;
        background: #111; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #model-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
      #model-canvas:active { cursor: grabbing; }
      .model-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.6); font-size: 0.9rem; }
      @keyframes fadeInHint { to { opacity: 1; } }
      .model-controls-hint {
        position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
        color: rgba(255,255,255,0.9); padding: 0.5rem 1rem;
        border-radius: 0; font-size: 0.82rem;
        border: 0.5px solid rgba(255,255,255,0.15);
        z-index: 2; pointer-events: none; opacity: 0;
        animation: fadeInHint 0.5s ease 1s forwards;
      }

      /* ── Buttons ─────────────────────────────────────────────── */
      .btn-primary, .btn-outline {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.45);
        border-radius: 2px;
        padding: 0.8rem 1.8rem;
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      .btn-primary:hover, .btn-outline:hover { background: #fff; color: #111; border-color: #fff; }

      /* ── Product card dark overrides (over products-catalog.css) */
      .product-grid .product-card {
        background: #0f0f0f !important;
        border: 0.5px solid rgba(255,255,255,0.08) !important;
        border-radius: 4px !important;
        box-shadow: none !important;
      }
      .product-grid .product-card:hover {
        background: #141414 !important;
        border-color: rgba(255,255,255,0.15) !important;
        transform: none !important;
        box-shadow: none !important;
      }
      .product-grid .product-card__image-container {
        background: #0a0a0a !important;
      }
      .product-grid .product-card__title { color: #fff !important; }
      .product-grid .product-card__description { color: rgba(255,255,255,0.5) !important; }
      .product-grid .product-card__price { color: rgba(255,255,255,0.8) !important; }
      .product-card .customize-btn.btn-primary {
        background: transparent !important;
        color: #fff !important;
        border: 1px solid rgba(255,255,255,0.45) !important;
        border-radius: 2px !important;
        box-shadow: none !important;
      }
      .product-card .customize-btn.btn-primary:hover {
        background: #fff !important;
        color: #111 !important;
        border-color: #fff !important;
        transform: none !important;
        box-shadow: none !important;
      }
      .product-card .customize-btn.btn-disabled {
        background: rgba(255,255,255,0.06) !important;
        color: rgba(255,255,255,0.3) !important;
        border: 0.5px solid rgba(255,255,255,0.1) !important;
      }

      /* ── Footer ──────────────────────────────────────────────── */
      .site-footer { display: none; }

      .footer {
        background: #080808;
        border-top: 1px solid rgba(255,255,255,0.07);
        padding: 2rem 1.75rem;
        position: relative; z-index: 1;
      }
      .footer__inner {
        max-width: 1280px; margin: 0 auto;
        display: flex; align-items: center;
        justify-content: space-between;
        flex-wrap: wrap; gap: 1rem;
      }
      .footer__copy {
        font-family: var(--mono); font-size: 0.65rem;
        letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
      }
      .footer__links { display: flex; gap: 1.75rem; align-items: center; }
      .footer__link {
        font-size: 0.78rem; font-weight: 300;
        color: rgba(255,255,255,0.35); text-decoration: none;
        transition: color 200ms ease;
      }
      .footer__link:hover { color: #fff; }
      .footer__location {
        font-family: var(--mono); font-size: 0.65rem;
        letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
      }
      @media (max-width: 640px) {
        .footer__inner { flex-direction: column; align-items: flex-start; }
      }

      /* old footer classes (unused) */
      .footer-grid, .footer-column, .footer-heading,
      .footer-links, .footer-tagline, .footer-contact,
      .footer-logo, .contact-item, .social-links,
      .social-icon, .newsletter, .newsletter-form,
      .footer-bottom, .legal-links { display: none; }
        padding: 4rem 0 2rem;
        border-top: 0.5px solid rgba(255,255,255,0.08);
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1.5fr;
        gap: 3rem;
        max-width: 1200px;
        margin: 0 auto 3rem;
        padding: 0 1.75rem;
      }
      .footer-logo {
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 0.9rem;
      }
      .footer-tagline { font-size: 0.83rem; color: rgba(255,255,255,0.4); margin-bottom: 1.2rem; line-height: 1.6; font-weight: 300; }
      .footer-contact { display: flex; flex-direction: column; gap: 0.65rem; }
      .contact-item { display: flex; align-items: center; gap: 0.6rem; color: rgba(255,255,255,0.45); text-decoration: none; font-size: 0.83rem; transition: color 200ms ease; }
      .contact-item:hover { color: #fff; }
      .contact-item .icon { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }
      .footer-heading { font-family: var(--mono); font-size: 0.62rem; font-weight: 400; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 1rem; }
      .footer-links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
      .footer-links a { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.83rem; font-weight: 300; transition: color 200ms ease; }
      .footer-links a:hover { color: rgba(255,255,255,0.8); }
      .social-links { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
      .social-icon { width: 20px; height: 20px; color: rgba(255,255,255,0.35); transition: color 200ms ease; }
      .social-links a:hover .social-icon { color: #fff; }
      .newsletter-form { display: flex; gap: 0.5rem; }
      .newsletter-form input {
        flex: 1; padding: 0.65rem 0.9rem;
        background: rgba(255,255,255,0.05);
        border: 0.5px solid rgba(255,255,255,0.12);
        border-radius: 2px; color: #fff; font-size: 0.82rem;
        font-family: inherit; outline: none;
        transition: border-color 200ms ease;
      }
      .newsletter-form input::placeholder { color: rgba(255,255,255,0.3); }
      .newsletter-form input:focus { border-color: rgba(255,255,255,0.4); }
      .newsletter-form button {
        padding: 0.65rem 0.9rem;
        background: transparent;
        border: 0.5px solid rgba(255,255,255,0.45);
        border-radius: 2px;
        color: #fff; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.3s ease, color 0.3s ease;
      }
      .newsletter-form button:hover { background: #fff; color: #111; }
      .footer-bottom {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5rem 1.75rem 0;
        border-top: 0.5px solid rgba(255,255,255,0.08);
        font-size: 0.75rem; color: rgba(255,255,255,0.3);
        max-width: 1200px; margin: 0 auto;
        flex-wrap: wrap; gap: 0.75rem;
      }
      .legal-links { display: flex; gap: 1.5rem; }
      .legal-links a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 200ms ease; }
      .legal-links a:hover { color: rgba(255,255,255,0.7); }

      /* ── Responsive ──────────────────────────────────────────── */
      @media (max-width: 900px) {
        .footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem; }
      }
      @media (max-width: 640px) {
        .footer-grid { grid-template-columns: 1fr; gap: 1.75rem; }
        .footer-bottom { flex-direction: column; align-items: flex-start; }
        .catalog-hero { min-height: 30vh; padding: 110px 1.25rem 40px; }
      }
      @media (max-width: 768px) {
        .feature-grid { grid-template-columns: 1fr; }
        .section { padding: 4rem 0; }
      }
    </style>
  </head>
  <body>

    <script>
      (function () {
        const observer = new IntersectionObserver(
          (entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const el = entry.target;
                el.style.transition =
                  "transform 500ms ease, opacity 500ms ease";
                el.style.opacity = "1";
                el.style.transform = "translateY(0)";
                obs.unobserve(el);
              }
            });
          },
          { threshold: 0.12 }
        );

        const selectors = [
          ".feature-card",
          ".product-card",
          ".configurator-card",
          ".model-viewer-container",
        ];
        selectors.forEach((sel) => {
          document.querySelectorAll(sel).forEach((el) => {
            el.style.opacity = "0";
            el.style.transform = "translateY(12px)";
            observer.observe(el);
          });
        });

        const root = document.getElementById("product-list-root");
        if (root) {
          const mo = new MutationObserver(() => {
            document.querySelectorAll(".product-card").forEach((el) => {
              if (!el.dataset.revealInit) {
                el.dataset.revealInit = "1";
                el.style.opacity = "0";
                el.style.transform = "translateY(12px)";
                observer.observe(el);
              }
            });
          });
          mo.observe(root, { childList: true, subtree: true });
        }
      })();
    </script>
