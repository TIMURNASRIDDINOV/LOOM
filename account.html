<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOM — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/auth.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="account-page">

  <div class="account-inner">

    <!-- Top nav bar -->
    <nav class="account-nav">
      <a href="index.html" class="account-nav-logo">LOOM</a>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span id="account-email" style="font-size:0.8rem;color:rgba(255,255,255,0.4);font-family:'DM Mono',monospace;"></span>
        <button class="account-logout" id="logoutBtn">Выйти</button>
      </div>
    </nav>

    <h1 class="account-title">Личный кабинет</h1>

    <!-- Profile card -->
    <div class="account-card">
      <p class="account-card-title">Профиль</p>

      <!-- Avatar + name header -->
      <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem;">
        <!-- Avatar circle (click to upload) -->
        <div id="avatar-wrap" style="position:relative;width:80px;height:80px;cursor:pointer;flex-shrink:0;" title="Нажмите для загрузки фото">
          <div id="avatar-placeholder" style="
            width:80px;height:80px;border-radius:50%;
            background:rgba(255,255,255,0.08);
            border:1.5px solid rgba(255,255,255,0.15);
            display:flex;align-items:center;justify-content:center;
            font-size:1.6rem;color:rgba(255,255,255,0.5);
            font-family:'DM Mono',monospace;
          " id="avatar-initials">?</div>
          <img id="avatar-img" src="" alt="Avatar"
            style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:none;border:1.5px solid rgba(255,255,255,0.15);" />
          <div style="
            position:absolute;bottom:0;right:0;
            width:24px;height:24px;border-radius:50%;
            background:#1a1a1a;border:1.5px solid rgba(255,255,255,0.2);
            display:flex;align-items:center;justify-content:center;
            font-size:0.65rem;color:rgba(255,255,255,0.6);
          ">✎</div>
        </div>
        <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" style="display:none" />

        <!-- Display name + inline edit -->
        <div style="flex:1;">
          <div id="name-display" style="display:flex;align-items:center;gap:0.5rem;">
            <span id="display-name" style="font-size:1.05rem;font-weight:400;"></span>
            <button id="name-edit-btn" style="
              background:none;border:none;cursor:pointer;padding:0.2rem;
              color:rgba(255,255,255,0.35);font-size:0.8rem;line-height:1;
              transition:color 0.15s;
            " title="Изменить имя">✎</button>
          </div>
          <div id="name-edit-form" style="display:none;margin-top:0.35rem;">
            <input id="name-input" type="text" maxlength="50" style="
              padding:0.4rem 0.65rem;border-radius:3px;
              border:0.5px solid rgba(255,255,255,0.25);
              background:rgba(255,255,255,0.06);color:#fff;
              font-family:inherit;font-size:0.88rem;outline:none;width:200px;
            " placeholder="Ваше имя" />
            <button id="name-save-btn" style="
              margin-left:0.4rem;padding:0.4rem 0.8rem;
              border:0.5px solid rgba(255,255,255,0.25);border-radius:3px;
              background:transparent;color:rgba(255,255,255,0.75);
              font-family:inherit;font-size:0.8rem;cursor:pointer;
            ">Сохранить</button>
            <button id="name-cancel-btn" style="
              margin-left:0.25rem;padding:0.4rem 0.6rem;
              border:none;background:none;color:rgba(255,255,255,0.35);
              font-family:inherit;font-size:0.8rem;cursor:pointer;
            ">×</button>
            <span id="name-save-status" style="margin-left:0.5rem;font-size:0.78rem;color:rgba(255,255,255,0.4);"></span>
          </div>
          <div id="avatar-status" style="font-size:0.75rem;color:rgba(255,255,255,0.35);margin-top:0.25rem;"></div>
        </div>
      </div>

      <div id="profile-rows">
        <div class="profile-row">
          <span class="profile-label">Загрузка…</span>
        </div>
      </div>
    </div>

    <!-- Orders card -->
    <div class="account-card">
      <p class="account-card-title">История заказов</p>
      <div id="orders-container">
        <p style="color:rgba(255,255,255,0.35);font-size:0.82rem">Загрузка…</p>
      </div>
    </div>

    <!-- Quick actions -->
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:0.5rem;">
      <a href="catalog.html" style="
        padding:0.55rem 1.1rem;
        border:0.5px solid rgba(255,255,255,0.2);
        border-radius:3px;
        color:rgba(255,255,255,0.6);
        text-decoration:none;
        font-size:0.78rem;
        transition:color 150ms,border-color 150ms;
      " onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.45)'"
         onmouseout="this.style.color='rgba(255,255,255,0.6)';this.style.borderColor='rgba(255,255,255,0.2)'">
        Каталог →
      </a>
      <a href="configurator.html" style="
        padding:0.55rem 1.1rem;
        border:0.5px solid rgba(255,255,255,0.2);
        border-radius:3px;
        color:rgba(255,255,255,0.6);
        text-decoration:none;
        font-size:0.78rem;
        transition:color 150ms,border-color 150ms;
      " onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.45)'"
         onmouseout="this.style.color='rgba(255,255,255,0.6)';this.style.borderColor='rgba(255,255,255,0.2)'">
        Создать дизайн →
      </a>
    </div>

  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/account.js"></script>
</body>
</html>
