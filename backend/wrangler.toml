name = "loom-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Custom domain route (uncomment after setting up):
routes = [
  { pattern = "api.loomdesign.uz", custom_domain = true },
  { pattern = "admin.loomdesign.uz", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"
# The bot username WITHOUT the @ prefix
BOT_USERNAME = "looom_design_bot"

# D1 Database — fill in database_id after running: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "loom-db"
database_id = "37d489b5-dd14-431c-93b0-0bb37ab45ff4"

# R2 Buckets
[[r2_buckets]]
binding = "LOOM_MODELS"
bucket_name = "loom-models"

[[r2_buckets]]
binding = "LOOM_UPLOADS"
bucket_name = "loom-uploads"

# KV Namespaces
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6dd51851f3ef4e20bc3fe5a7d5bbe23d"

# Workers AI — text-to-image model comparison harness (admin-only spike).
# Free tier: 10,000 neurons/day, resets 00:00 UTC. See lib/ai-models.ts.
[ai]
binding = "AI"

# Images binding — background removal (segment: 'foreground') for the cutout endpoint.
# `wrangler dev` uses the real Images service by default (the local mock is
# opt-in via --experimental-images-local-mode), so segment: 'foreground' can be
# verified without deploying.
[images]
binding = "IMAGES"

# Secrets (set via: wrangler secret put <NAME>):
#   JWT_SECRET               — 64+ char random string for signing JWTs
#   TELEGRAM_BOT_TOKEN       — from BotFather
#   TELEGRAM_CHAT_ID         — admin chat ID for order notifications
#   TELEGRAM_WEBHOOK_SECRET  — 32+ char random string, set via set-telegram-webhook.ts

# ─── Staging ────────────────────────────────────────────────────────────────
# Deploy: npx wrangler deploy --env staging   (rebuild steps: scripts/staging-setup.md)
# DANGER: `routes` is inherited from the top level. Keep `routes = []` here or a
# staging deploy moves api./admin.loomdesign.uz onto the staging Worker.
# Bindings are NOT inherited: everything staging uses is declared below, and
# only *-staging resources. No [ai] / [images]: those routes fail closed (502).
[env.staging]
routes = []
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
BOT_USERNAME = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "loom-db-staging"
database_id = "9f6e4867-6655-4ce8-84cd-455d2bc20e61"

[[env.staging.r2_buckets]]
binding = "LOOM_MODELS"
bucket_name = "loom-models-staging"

[[env.staging.r2_buckets]]
binding = "LOOM_UPLOADS"
bucket_name = "loom-uploads-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "0f0c4d22269f4385abe8550cb49800dc"

[dev]
port = 8787
local_protocol = "http"
