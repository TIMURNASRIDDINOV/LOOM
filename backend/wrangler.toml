name = "loom-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Custom domain route (uncomment after setting up):
routes = [
  { pattern = "api.loomdesign.uz", custom_domain = true },
  { pattern = "admin.loomdesign.uz", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"
# The bot username WITHOUT the @ prefix
BOT_USERNAME = "looom_design_bot"

# D1 Database — fill in database_id after running: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "loom-db"
database_id = "37d489b5-dd14-431c-93b0-0bb37ab45ff4"

# R2 Buckets
[[r2_buckets]]
binding = "LOOM_MODELS"
bucket_name = "loom-models"

[[r2_buckets]]
binding = "LOOM_UPLOADS"
bucket_name = "loom-uploads"

# KV Namespaces
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6dd51851f3ef4e20bc3fe5a7d5bbe23d"

# Workers AI — text-to-image model comparison harness (admin-only spike).
# Free tier: 10,000 neurons/day, resets 00:00 UTC. See lib/ai-models.ts.
[ai]
binding = "AI"

# Images binding — background removal (segment: 'foreground') for the cutout endpoint.
# `wrangler dev` uses the real Images service by default (the local mock is
# opt-in via --experimental-images-local-mode), so segment: 'foreground' can be
# verified without deploying.
[images]
binding = "IMAGES"

# Secrets (set via: wrangler secret put <NAME>):
#   JWT_SECRET               — 64+ char random string for signing JWTs
#   TELEGRAM_BOT_TOKEN       — from BotFather
#   TELEGRAM_CHAT_ID         — admin chat ID for order notifications
#   TELEGRAM_WEBHOOK_SECRET  — 32+ char random string, set via set-telegram-webhook.ts

[dev]
port = 8787
local_protocol = "http"
