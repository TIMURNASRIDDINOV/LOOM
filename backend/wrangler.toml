name = "loom-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Custom domain route (uncomment after setting up):
routes = [
  { pattern = "api.looom.me", custom_domain = true },
  { pattern = "admin.looom.me", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"

# D1 Database — fill in database_id after running: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "loom-db"
database_id = "37d489b5-dd14-431c-93b0-0bb37ab45ff4"

# R2 Buckets
[[r2_buckets]]
binding = "LOOM_MODELS"
bucket_name = "loom-models"

[[r2_buckets]]
binding = "LOOM_UPLOADS"
bucket_name = "loom-uploads"

# KV Namespaces
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6dd51851f3ef4e20bc3fe5a7d5bbe23d"

# Secrets (set via: wrangler secret put <NAME>):
#   JWT_SECRET
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

[dev]
port = 8787
local_protocol = "http"
