name: CI

# The release gates from PRD-201 R4, on every PR to main (LOOM-151):
#   1. backend/ typechecks (tsc --noEmit)
#   2. no asset ?v= drift (tools/check-asset-versions.mjs)
#   3. every site JS file parses (node --check)
#
# No secrets and no deploys: Cloudflare Pages and Workers publish from the
# branch themselves, and every step here only reads the checkout.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The ?v= gate diffs the branch against its base commit, so it needs
          # the history the default shallow clone does not fetch.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The same command `predeploy` runs locally before a deploy. Kept
      # literal here so the gate does not depend on that script (it landed in
      # LOOM-149) being present in the branch being tested.
      - name: Backend typecheck (tsc --noEmit)
        working-directory: backend
        run: npx --no-install tsc --noEmit

      - name: Artwork metadata and category routes (local D1)
        run: node backend/scripts/artwork-categories-test.mjs

      - name: Instagram posts admin API (local D1)
        run: node backend/scripts/instagram-test.mjs

      - name: Instagram weekly AI drafts (local D1, AI stubbed)
        run: node backend/scripts/instagram-drafter-test.mjs

      - name: Instagram publishing cron (local D1, Meta stubbed)
        run: node backend/scripts/instagram-publish-test.mjs

      - name: Instagram insights pull (local D1, Meta stubbed)
        run: node backend/scripts/instagram-insights-test.mjs

      - name: Instagram ads, always paused and capped (local D1, Marketing API stubbed)
        run: node backend/scripts/instagram-ads-test.mjs

      - name: Asset ?v= drift (no stale immutable asset)
        run: node tools/check-asset-versions.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Site JS parses (node --check)
        run: node tools/check-site-js.mjs
