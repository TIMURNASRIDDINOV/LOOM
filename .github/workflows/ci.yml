name: CI

# The release gates from PRD-201 R4, on every PR to main (LOOM-151):
#   1. backend/ typechecks (tsc --noEmit)
#   2. no asset ?v= drift (tools/check-asset-versions.mjs)
#   3. every site JS file parses (node --check)
# Plus: the /uz/ and /en/ pages match their sources (LOOM-330).
#
# No secrets and no deploys: Cloudflare Pages and Workers publish from the
# branch themselves, and every step here only reads the checkout.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The ?v= gate diffs the branch against its base commit, so it needs
          # the history the default shallow clone does not fetch.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The same command `predeploy` runs locally before a deploy. Kept
      # literal here so the gate does not depend on that script (it landed in
      # LOOM-149) being present in the branch being tested.
      - name: Backend typecheck (tsc --noEmit)
        working-directory: backend
        run: npx --no-install tsc --noEmit

      - name: Artwork metadata and category routes (local D1)
        run: node backend/scripts/artwork-categories-test.mjs

      - name: Configurator funnel routes (local D1)
        run: node backend/scripts/funnel-test.mjs

      - name: Prepayment by card transfer, sweep, staff confirm, scheduled deletion (local D1, Telegram stubbed)
        run: node backend/scripts/prepay-test.mjs

      - name: Instagram posts admin API (local D1)
        run: node backend/scripts/instagram-test.mjs

      - name: Instagram weekly AI drafts (local D1, AI stubbed)
        run: node backend/scripts/instagram-drafter-test.mjs

      - name: Instagram publishing cron (local D1, Meta stubbed)
        run: node backend/scripts/instagram-publish-test.mjs

      - name: Instagram insights pull (local D1, Meta stubbed)
        run: node backend/scripts/instagram-insights-test.mjs

      - name: Instagram ads, always paused and capped (local D1, Marketing API stubbed)
        run: node backend/scripts/instagram-ads-test.mjs

      - name: Instagram suggested posting times
        run: node backend/scripts/instagram-times-test.mjs

      - name: GA4 admin readout route (local D1, Google stubbed)
        run: node backend/scripts/ga4-test.mjs

      - name: Clarity snapshot cron and admin route (local D1, Clarity stubbed)
        run: node backend/scripts/clarity-test.mjs

      - name: Home-page hero picture admin API (local D1/R2)
        run: node backend/scripts/site-hero-test.mjs

      - name: Admin dashboard statistics (local D1)
        run: node backend/scripts/dashboard-stats-test.mjs

      - name: Code sign-in through Telegram Gateway (local D1/KV, faked Gateway)
        run: node backend/scripts/code-auth-test.mjs

      - name: Asset ?v= drift (no stale immutable asset)
        run: node tools/check-asset-versions.mjs --base "${{ github.event.pull_request.base.sha }}"

      # Customer pages must not load the old maximalist skin (LOOM-341).
      - name: No old skin on customer pages (tools/check-old-skin.mjs)
        run: node tools/check-old-skin.mjs

      - name: Site JS parses (node --check)
        run: node tools/check-site-js.mjs

      # /uz/ and /en/ pages, hreflang tags and sitemap.xml are generated from
      # the Russian pages and assets/i18n.js. Fails when they are stale, when a
      # string lacks a language, or when Russian text is left in a uz/en page.
      - name: Language pages up to date (tools/build-locales.mjs --check)
        run: node tools/build-locales.mjs --check
