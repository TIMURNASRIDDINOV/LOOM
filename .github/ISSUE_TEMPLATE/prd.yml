name: PRD
description: A feature or change big enough to need requirements. The doc lives in docs/prd/; this issue tracks its tasks.
title: "PRD-NNN — "
labels: ["prd"]
projects: ["TIMURNASRIDDINOV/1"]
body:
  - type: markdown
    attributes:
      value: |
        **How PRDs work here:** write the doc first — copy `docs/prd/TEMPLATE.md` to `docs/prd/PRD-NNN-slug.md` and open a PR for it.
        This issue is the tracker: once it exists, add each task as a **sub-issue** (the "Create sub-issue" button below the description).
        Set the milestone on the right.
  - type: input
    id: doc
    attributes:
      label: PRD document
      description: Path to the doc in the repo.
      placeholder: docs/prd/PRD-004-linkable-uzbek.md
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph — the problem and what changes. Details belong in the doc.
    validations:
      required: true
  - type: input
    id: metric
    attributes:
      label: Success metric
      description: The number that proves it worked, and where it is read.
      placeholder: "≥ 60% of first-time visitors reach the configurator — admin funnel panel"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        Tasks are the sub-issues below.
