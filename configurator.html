<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOOM - Конфигуратор футболок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Product Catalog CSS -->
    <link rel="stylesheet" href="products-catalog.css" />
    <style>
      /* Base System - Match index.html */
      * {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      :root {
        --bg: #ffffff;
        --text: #0a0a0a;
        --muted: #6b7280;
        --hairline: rgba(0, 0, 0, 0.08);
        --panel: #ffffff;
        --brand: #0a84ff;
        --brand-ink: #0b66d6;
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ===== Navigation - Reused from index.html ===== */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        min-height: 72px;
        background: linear-gradient(
          180deg,
          rgba(8, 8, 10, 0.6),
          rgba(8, 8, 10, 0.5)
        );
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        box-shadow: 0 6px 30px rgba(3, 3, 5, 0.12);
        will-change: auto;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        contain: layout style paint;
      }

      .nav-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 72px;
      }

      .nav-brand {
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #ffffff;
        text-transform: uppercase;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        margin-right: 0;
      }

      @media (min-width: 768px) {
        .nav-links {
          gap: 1.5rem;
          margin-right: 1.5rem;
        }
      }

      @media (min-width: 1024px) {
        .nav-links {
          gap: 2rem;
          margin-right: 2rem;
        }
      }

      .nav-link {
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.5rem 0.75rem;
        margin: 0;
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 280ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-link:hover {
        color: #2596be;
      }

      .nav-link.active {
        color: #ffffff;
        font-weight: 600;
      }

      .link-underline-center::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%) scaleX(0);
        transform-origin: center;
        height: 2px;
        width: 70%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #2596be, transparent);
        transition: transform 380ms cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }

      .link-underline-center:hover::after {
        transform: translateX(-50%) scaleX(1);
      }

      .link-underline-center.active::after {
        transform: translateX(-50%) scaleX(1);
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
      }

      .nav-icon {
        width: 16px;
        height: 16px;
        opacity: 0.85;
        transition: opacity 280ms ease;
      }

      .nav-link:hover .nav-icon,
      .nav-link.active .nav-icon {
        opacity: 1;
      }

      /* ===== Configurator Page Specific Styles ===== */
      .configurator-page {
        padding-top: 96px;
        min-height: 100vh;
        background: #fafafa;
      }

      .page-header {
        max-width: 1280px;
        margin: 0 auto;
        padding: 3rem 2rem 2rem;
        text-align: center;
      }

      .page-title {
        font-size: clamp(2rem, 4.5vw, 2.75rem);
        font-weight: 800;
        color: var(--text);
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.02em;
      }

      .page-subtitle {
        font-size: 1.05rem;
        color: var(--muted);
        margin: 0;
        max-width: 640px;
        margin-left: auto;
        margin-right: auto;
      }

      /* ===== 2-Column Grid Layout ===== */
      .configurator-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 2rem 4rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      @media (min-width: 1024px) {
        .configurator-container {
          grid-template-columns: 60% 40%;
          gap: 3rem;
        }
      }

      /* ===== Preview Area (Left Column) ===== */
      .preview-section {
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 20px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .preview-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text);
        margin: 0;
      }

      .preview-canvas {
        background: #f9fafb;
        border-radius: 16px;
        padding: 3rem 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 500px;
        position: relative;
      }

      #designCanvas {
        border-radius: 12px;
        background: #f9fafb;
        cursor: default;
        max-width: 100%;
        height: auto;
        display: block;
      }

      #designCanvas.dragging {
        cursor: move;
      }

      /* ===== Controls Panel (Right Column) ===== */
      .controls-section {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .control-card {
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        padding: 1.5rem;
        transition: box-shadow 0.2s ease;
      }

      .control-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }

      .control-label {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 1rem 0;
        display: block;
      }

      /* Color Selector */
      .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
        gap: 0.75rem;
      }

      .color-option {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
      }

      .color-option:hover {
        transform: scale(1.1);
      }

      .color-option.selected {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
      }

      .color-option::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 1.25rem;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .color-option.selected::after {
        opacity: 1;
      }

      /* Form Controls */
      .form-input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s ease;
        outline: none;
        background: white;
      }

      .form-input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
      }

      .form-select {
        width: 100%;
        padding: 0.85rem 2.5rem 0.85rem 1rem;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        appearance: none;
        background: white
          url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIiIGhlaWdodD0iOCIgdmlld0JveD0iMCAwIDEyIDgiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxwYXRoIGQ9Ik0xIDEuNUw2IDYuNUwxMSAxLjUiIHN0cm9rZT0iIzZCNzI4MCIgc3Ryb2tlLXdpZHRoPSIxLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K")
          no-repeat right 1rem center;
        transition: all 0.2s ease;
        outline: none;
      }

      .form-select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
      }

      /* File Upload */
      .upload-zone {
        border: 2px dashed var(--hairline);
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        text-align: center;
        background: #fafafa;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .upload-zone:hover {
        border-color: var(--brand);
        background: rgba(10, 132, 255, 0.02);
      }

      .upload-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.4;
      }

      .upload-text {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 0.5rem;
      }

      .upload-subtext {
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* Sliders */
      .slider-group {
        margin-bottom: 1.5rem;
      }

      .slider-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text);
      }

      .slider-value {
        color: var(--muted);
        font-weight: 600;
      }

      .slider {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #e5e7eb;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--brand);
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .slider::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      .slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--brand);
        cursor: pointer;
        border: none;
        transition: transform 0.2s ease;
      }

      .slider::-moz-range-thumb:hover {
        transform: scale(1.2);
      }

      /* Buttons - Matching index.html CTAs */
      .btn-primary {
        background: #0a0a0a;
        color: white;
        padding: 0.9rem 1.6rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        display: inline-block;
        text-align: center;
        text-decoration: none;
        transition: all 0.2s ease;
        width: 100%;
      }

      .btn-primary:hover {
        background: #1a1a1a;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .btn-secondary {
        background: rgba(0, 0, 0, 0.04);
        color: var(--text);
        padding: 0.9rem 1.6rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        display: inline-block;
        text-align: center;
        text-decoration: none;
        transition: all 0.2s ease;
        width: 100%;
      }

      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.08);
      }

      .btn-group {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .btn-group .btn-primary,
      .btn-group .btn-secondary {
        flex: 1;
      }

      /* Canvas Styles */
      #designCanvas {
        border-radius: 12px;
        background: #f9fafb;
        cursor: default;
      }

      #designCanvas.dragging {
        cursor: move;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .configurator-page {
          padding-top: 80px;
        }

        .page-header {
          padding: 2rem 1rem 1.5rem;
        }

        .configurator-container {
          padding: 0 1rem 3rem;
          gap: 2rem;
        }

        .preview-section {
          padding: 1.5rem;
        }

        .preview-canvas {
          padding: 2rem 1rem;
          min-height: 400px;
        }

        .control-card {
          padding: 1.25rem;
        }

        .color-grid {
          grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
          gap: 0.5rem;
        }

        .color-option {
          width: 48px;
          height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation - Consistent with index.html -->
    <nav class="nav">
      <div class="nav-content">
        <div class="nav-brand">LOOM</div>
        <div class="nav-links space-md-x-6 space-lg-x-8">
          <a
            href="index.html"
            class="nav-link link-underline-center text-sm lg:text-base"
            >Главная</a
          >
          <a
            href="catalog.html"
            class="nav-link link-underline-center text-sm lg:text-base"
            >Каталог</a
          >
          <a
            href="configurator.html"
            class="nav-link link-underline-center active text-sm lg:text-base"
            >Кастомизация</a
          >
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="configurator-page">
      <!-- Page Header -->
      <header class="page-header">
        <h1 class="page-title">Создайте свой дизайн</h1>
        <p class="page-subtitle">
          Персонализируйте футболку с помощью нашего интуитивного редактора
        </p>
      </header>

      <!-- 2-Column Layout: Preview + Controls -->
      <div class="configurator-container">
        <!-- Left Column: Preview Area -->
        <section class="preview-section" aria-label="Предпросмотр дизайна">
          <div class="preview-header">
            <h2 class="preview-title">Предпросмотр</h2>
          </div>

          <div class="preview-canvas" id="canvas-container">
            <!-- Canvas for dynamic rendering -->
            <canvas
              id="designCanvas"
              width="600"
              height="700"
              style="max-width: 100%; height: auto; display: block"
            ></canvas>
          </div>
        </section>

        <!-- Right Column: Configuration Controls -->
        <aside class="controls-section" aria-label="Панель настройки">
          <!-- Color Selector -->
          <div class="control-card">
            <label class="control-label" for="color-selector">
              Цвет футболки
            </label>
            <div
              class="color-grid"
              id="color-selector"
              role="radiogroup"
              aria-label="Выбор цвета футболки"
            >
              <button
                class="color-option selected"
                style="background: #ffffff; border: 2px solid #e5e7eb"
                data-color="white"
                role="radio"
                aria-checked="true"
                aria-label="Белый"
              ></button>
              <button
                class="color-option"
                style="background: #1f2937"
                data-color="black"
                role="radio"
                aria-checked="false"
                aria-label="Черный"
              ></button>
              <button
                class="color-option"
                style="background: #1e40af"
                data-color="navy"
                role="radio"
                aria-checked="false"
                aria-label="Темно-синий"
              ></button>
              <button
                class="color-option"
                style="background: #6b7280"
                data-color="gray"
                role="radio"
                aria-checked="false"
                aria-label="Серый"
              ></button>
              <button
                class="color-option"
                style="background: #dc2626"
                data-color="red"
                role="radio"
                aria-checked="false"
                aria-label="Красный"
              ></button>
            </div>
          </div>

          <!-- Text Customization -->
          <div class="control-card">
            <label class="control-label" for="text-input">
              Добавить текст
            </label>
            <div style="display: flex; flex-direction: column; gap: 1rem">
              <input
                type="text"
                id="text-input"
                class="form-input"
                placeholder="Введите текст на футболке..."
                aria-label="Текст для печати"
              />
              <select
                id="font-select"
                class="form-select"
                aria-label="Выбор шрифта"
              >
                <option value="Inter">Inter</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Times New Roman">Times New Roman</option>
              </select>
            </div>
          </div>

          <!-- Image Upload -->
          <div class="control-card">
            <label class="control-label"> Загрузить изображение </label>
            <div
              class="upload-zone"
              id="upload-zone"
              tabindex="0"
              role="button"
              aria-label="Загрузить изображение"
            >
              <div class="upload-icon">🎨</div>
              <p class="upload-text">Перетащите изображение сюда</p>
              <p class="upload-subtext">или нажмите для выбора файла</p>
              <input
                type="file"
                id="file-input"
                accept="image/png,image/jpeg,image/svg+xml"
                style="display: none"
                aria-label="Выбор файла изображения"
              />
            </div>
          </div>

          <!-- Adjustments -->
          <div class="control-card">
            <label class="control-label"> Настройки размера и поворота </label>

            <div class="slider-group">
              <div class="slider-label">
                <span>Размер дизайна</span>
                <span class="slider-value" id="size-value">100%</span>
              </div>
              <input
                type="range"
                id="size-slider"
                class="slider"
                min="50"
                max="150"
                value="100"
                aria-label="Размер дизайна"
              />
            </div>

            <div class="slider-group">
              <div class="slider-label">
                <span>Поворот</span>
                <span class="slider-value" id="rotation-value">0°</span>
              </div>
              <input
                type="range"
                id="rotation-slider"
                class="slider"
                min="-180"
                max="180"
                value="0"
                aria-label="Угол поворота"
              />
            </div>
          </div>

          <!-- Actions -->
          <div class="control-card">
            <label class="control-label"> Действия </label>
            <button
              id="reset-btn"
              class="btn-secondary"
              aria-label="Сбросить все настройки"
            >
              Сбросить всё
            </button>
          </div>
        </aside>
      </div>
    </main>

    <!-- JavaScript - Production Ready -->
    <script>
      // DOM Ready
      document.addEventListener("DOMContentLoaded", function () {
        // ===== Configuration =====
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 700;

        // Printable area (bounding box) - center chest area
        const PRINT_AREA = {
          x: 175,
          y: 220,
          width: 250,
          height: 280,
        };

        // Image paths for different colors
        const colorImages = {
          white: "configuratorprodutcs/tshirt_basic2d_white_001.png",
          black: "configuratorprodutcs/tshirt_basic2d_black_001.png",
          navy: "configuratorprodutcs/tshirt_basic2d_navy_001.png",
          gray: "configuratorprodutcs/tshirt_basic2d_gray_001.png",
          red: "configuratorprodutcs/tshirt_basic2d_red_001.png",
        };

        // ===== Canvas Setup =====
        const canvas = document.getElementById("designCanvas");
        const ctx = canvas.getContext("2d");

        // State management
        let state = {
          tshirtImage: null,
          currentColor: "white",
          uploadedImage: null,
          uploadedImageData: {
            x: PRINT_AREA.x + PRINT_AREA.width / 2,
            y: PRINT_AREA.y + PRINT_AREA.height / 2,
            scale: 1,
            rotation: 0,
            originalWidth: 0,
            originalHeight: 0,
          },
          text: "",
          textFont: "Inter",
          textColor: "#000000",
          showBoundingBox: true,
          isDragging: false,
          dragStartX: 0,
          dragStartY: 0,
          fontsLoaded: false,
        };

        // ===== Font Loading =====
        document.fonts.ready.then(() => {
          state.fontsLoaded = true;
          redrawCanvas();
        });

        // Load initial t-shirt image
        function loadTshirtImage(color) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function () {
            state.tshirtImage = img;
            state.currentColor = color;
            redrawCanvas();
          };
          img.onerror = function () {
            console.error("Failed to load t-shirt image:", colorImages[color]);
          };
          img.src = colorImages[color];
        }

        // Initial load
        loadTshirtImage("white");

        // ===== Core Rendering Function =====
        function redrawCanvas() {
          // Clear canvas
          ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

          // 1. Draw base t-shirt
          if (state.tshirtImage) {
            ctx.drawImage(state.tshirtImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
          }

          // 2. Draw bounding box guide
          if (state.showBoundingBox) {
            ctx.save();
            ctx.strokeStyle = "rgba(10, 132, 255, 0.6)";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(
              PRINT_AREA.x,
              PRINT_AREA.y,
              PRINT_AREA.width,
              PRINT_AREA.height
            );
            ctx.fillStyle = "rgba(240, 240, 240, 0.15)";
            ctx.fillRect(
              PRINT_AREA.x,
              PRINT_AREA.y,
              PRINT_AREA.width,
              PRINT_AREA.height
            );
            ctx.restore();
          }

          // 3. Draw uploaded design
          if (state.uploadedImage) {
            ctx.save();
            ctx.translate(state.uploadedImageData.x, state.uploadedImageData.y);
            ctx.rotate((state.uploadedImageData.rotation * Math.PI) / 180);
            ctx.scale(
              state.uploadedImageData.scale,
              state.uploadedImageData.scale
            );

            const w = state.uploadedImageData.originalWidth;
            const h = state.uploadedImageData.originalHeight;
            ctx.drawImage(state.uploadedImage, -w / 2, -h / 2, w, h);
            ctx.restore();
          }

          // 4. Draw text
          if (state.text && state.fontsLoaded) {
            ctx.save();
            ctx.font = `600 ${state.textSize || 32}px ${state.textFont}`;
            ctx.fillStyle = state.textColor;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Center text in print area
            const textX = PRINT_AREA.x + PRINT_AREA.width / 2;
            const textY = PRINT_AREA.y + PRINT_AREA.height / 2;

            // Draw text with shadow for better visibility
            ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(state.text, textX, textY);
            ctx.restore();
          }
        }

        // ===== Helper Functions =====
        function constrainToBounds(x, y) {
          const halfW =
            (state.uploadedImageData.originalWidth *
              state.uploadedImageData.scale) /
            2;
          const halfH =
            (state.uploadedImageData.originalHeight *
              state.uploadedImageData.scale) /
            2;

          const minX = PRINT_AREA.x + halfW;
          const maxX = PRINT_AREA.x + PRINT_AREA.width - halfW;
          const minY = PRINT_AREA.y + halfH;
          const maxY = PRINT_AREA.y + PRINT_AREA.height - halfH;

          return {
            x: Math.max(minX, Math.min(maxX, x)),
            y: Math.max(minY, Math.min(maxY, y)),
          };
        }

        function fitImageToBounds(img) {
          const imgAspect = img.width / img.height;
          const boxAspect = PRINT_AREA.width / PRINT_AREA.height;

          let scale = 1;
          if (imgAspect > boxAspect) {
            // Image is wider
            scale = (PRINT_AREA.width * 0.8) / img.width;
          } else {
            // Image is taller
            scale = (PRINT_AREA.height * 0.8) / img.height;
          }

          return Math.min(scale, 1); // Don't upscale
        }

        // ===== Color Selection Handler =====
        const colorButtons = document.querySelectorAll(".color-option");
        colorButtons.forEach((button) => {
          button.addEventListener("click", function () {
            // Remove selected class from all buttons
            colorButtons.forEach((btn) => {
              btn.classList.remove("selected");
              btn.setAttribute("aria-checked", "false");
            });

            // Add selected class to clicked button
            this.classList.add("selected");
            this.setAttribute("aria-checked", "true");

            // Load new t-shirt image
            const color = this.dataset.color;
            if (colorImages[color]) {
              loadTshirtImage(color);
            }
          });
        });

        // File Upload Handler
        const uploadZone = document.getElementById("upload-zone");
        const fileInput = document.getElementById("file-input");

        uploadZone.addEventListener("click", () => fileInput.click());

        uploadZone.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            fileInput.click();
          }
        });

        fileInput.addEventListener("change", function (e) {
          if (this.files && this.files[0]) {
            handleFileUpload(this.files[0]);
          }
        });

        // Drag and drop
        uploadZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadZone.style.borderColor = "var(--brand)";
          uploadZone.style.background = "rgba(10, 132, 255, 0.05)";
        });

        uploadZone.addEventListener("dragleave", () => {
          uploadZone.style.borderColor = "";
          uploadZone.style.background = "";
        });

        uploadZone.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadZone.style.borderColor = "";
          uploadZone.style.background = "";

          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleFileUpload(e.dataTransfer.files[0]);
          }
        });

        function handleFileUpload(file) {
          if (!file.type.startsWith("image/")) {
            alert("Пожалуйста, загрузите файл изображения");
            return;
          }

          const reader = new FileReader();
          reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
              state.uploadedImage = img;
              state.uploadedImageData.originalWidth = img.width;
              state.uploadedImageData.originalHeight = img.height;

              // Fit image to bounds
              const fitScale = fitImageToBounds(img);
              state.uploadedImageData.scale = fitScale;

              // Center in print area
              state.uploadedImageData.x = PRINT_AREA.x + PRINT_AREA.width / 2;
              state.uploadedImageData.y = PRINT_AREA.y + PRINT_AREA.height / 2;
              state.uploadedImageData.rotation = 0;

              redrawCanvas();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        // Slider Value Display
        const sizeSlider = document.getElementById("size-slider");
        const sizeValue = document.getElementById("size-value");

        sizeSlider.addEventListener("input", function () {
          sizeValue.textContent = this.value + "%";
          if (state.uploadedImage) {
            const baseFit = fitImageToBounds(state.uploadedImage);
            state.uploadedImageData.scale = baseFit * (this.value / 100);

            // Re-constrain to bounds
            const constrained = constrainToBounds(
              state.uploadedImageData.x,
              state.uploadedImageData.y
            );
            state.uploadedImageData.x = constrained.x;
            state.uploadedImageData.y = constrained.y;

            redrawCanvas();
          }
        });

        const rotationSlider = document.getElementById("rotation-slider");
        const rotationValue = document.getElementById("rotation-value");

        rotationSlider.addEventListener("input", function () {
          rotationValue.textContent = this.value + "°";
          if (state.uploadedImage) {
            state.uploadedImageData.rotation = parseFloat(this.value);
            redrawCanvas();
          }
        });

        // Reset Button
        const resetBtn = document.getElementById("reset-btn");
        resetBtn.addEventListener("click", function () {
          // Reset all controls to default
          document.getElementById("text-input").value = "";
          document.getElementById("font-select").selectedIndex = 0;
          sizeSlider.value = 100;
          sizeValue.textContent = "100%";
          rotationSlider.value = 0;
          rotationValue.textContent = "0°";
          fileInput.value = "";

          // Reset state
          state.uploadedImage = null;
          state.text = "";
          state.textFont = "Inter";
          state.textColor = "#000000";
          state.uploadedImageData = {
            x: PRINT_AREA.x + PRINT_AREA.width / 2,
            y: PRINT_AREA.y + PRINT_AREA.height / 2,
            scale: 1,
            rotation: 0,
            originalWidth: 0,
            originalHeight: 0,
          };

          // Reset to white t-shirt
          colorButtons.forEach((btn) => {
            btn.classList.remove("selected");
            btn.setAttribute("aria-checked", "false");
          });
          colorButtons[0].classList.add("selected");
          colorButtons[0].setAttribute("aria-checked", "true");
          loadTshirtImage("white");
        });

        // Text Input Handler
        const textInput = document.getElementById("text-input");
        const fontSelect = document.getElementById("font-select");

        textInput.addEventListener("input", function () {
          state.text = this.value;
          redrawCanvas();
        });

        fontSelect.addEventListener("change", function () {
          state.textFont = this.value;
          // Ensure font is loaded before rendering
          document.fonts
            .load(`600 ${state.textSize}px ${this.value}`)
            .then(() => {
              redrawCanvas();
            });
        });

        // ===== Drag Functionality =====
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        canvas.addEventListener("mousedown", function (e) {
          if (!state.uploadedImage) return;

          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const mouseX = (e.clientX - rect.left) * scaleX;
          const mouseY = (e.clientY - rect.top) * scaleY;

          // Check if click is on uploaded image
          const halfW =
            (state.uploadedImageData.originalWidth *
              state.uploadedImageData.scale) /
            2;
          const halfH =
            (state.uploadedImageData.originalHeight *
              state.uploadedImageData.scale) /
            2;

          if (
            mouseX >= state.uploadedImageData.x - halfW &&
            mouseX <= state.uploadedImageData.x + halfW &&
            mouseY >= state.uploadedImageData.y - halfH &&
            mouseY <= state.uploadedImageData.y + halfH
          ) {
            isDragging = true;
            dragOffsetX = mouseX - state.uploadedImageData.x;
            dragOffsetY = mouseY - state.uploadedImageData.y;
            canvas.style.cursor = "move";
          }
        });

        canvas.addEventListener("mousemove", function (e) {
          if (!isDragging) return;

          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const mouseX = (e.clientX - rect.left) * scaleX;
          const mouseY = (e.clientY - rect.top) * scaleY;

          const newX = mouseX - dragOffsetX;
          const newY = mouseY - dragOffsetY;

          const constrained = constrainToBounds(newX, newY);
          state.uploadedImageData.x = constrained.x;
          state.uploadedImageData.y = constrained.y;

          redrawCanvas();
        });

        canvas.addEventListener("mouseup", function () {
          isDragging = false;
          canvas.style.cursor = "default";
        });

        canvas.addEventListener("mouseleave", function () {
          isDragging = false;
          canvas.style.cursor = "default";
        });

        // Touch support for mobile
        canvas.addEventListener("touchstart", function (e) {
          if (!state.uploadedImage) return;
          e.preventDefault();

          const touch = e.touches[0];
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const touchX = (touch.clientX - rect.left) * scaleX;
          const touchY = (touch.clientY - rect.top) * scaleY;

          const halfW =
            (state.uploadedImageData.originalWidth *
              state.uploadedImageData.scale) /
            2;
          const halfH =
            (state.uploadedImageData.originalHeight *
              state.uploadedImageData.scale) /
            2;

          if (
            touchX >= state.uploadedImageData.x - halfW &&
            touchX <= state.uploadedImageData.x + halfW &&
            touchY >= state.uploadedImageData.y - halfH &&
            touchY <= state.uploadedImageData.y + halfH
          ) {
            isDragging = true;
            dragOffsetX = touchX - state.uploadedImageData.x;
            dragOffsetY = touchY - state.uploadedImageData.y;
          }
        });

        canvas.addEventListener("touchmove", function (e) {
          if (!isDragging) return;
          e.preventDefault();

          const touch = e.touches[0];
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const touchX = (touch.clientX - rect.left) * scaleX;
          const touchY = (touch.clientY - rect.top) * scaleY;

          const newX = touchX - dragOffsetX;
          const newY = touchY - dragOffsetY;

          const constrained = constrainToBounds(newX, newY);
          state.uploadedImageData.x = constrained.x;
          state.uploadedImageData.y = constrained.y;

          redrawCanvas();
        });

        canvas.addEventListener("touchend", function () {
          isDragging = false;
        });
      });
    </script>
  </body>
</html>
