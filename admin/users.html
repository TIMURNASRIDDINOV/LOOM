<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пользователи — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    :root { --mono: 'DM Mono', monospace; --hairline: rgba(255,255,255,0.08); --muted: rgba(255,255,255,0.45); }
    body { background: #0a0a0a; color: #fff; margin: 0; }

    .page { padding: 2rem 1.75rem; max-width: 1200px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
    .page-title { font-size: 1.5rem; font-weight: 300; letter-spacing: -0.02em; margin: 0; }

    /* Filters */
    .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center; }
    .filter-input, .filter-select {
      padding: 0.5rem 0.8rem; border-radius: 3px;
      border: 0.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: #fff; font-family: inherit; font-size: 0.82rem; outline: none;
    }
    .filter-input::placeholder { color: rgba(255,255,255,0.3); }
    .filter-input:focus, .filter-select:focus { border-color: rgba(255,255,255,0.35); }
    .filter-select option { background: #1a1a1a; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 0.5rem 0.75rem; text-align: left; border-bottom: 0.5px solid rgba(255,255,255,0.08); white-space: nowrap; }
    td { padding: 0.7rem 0.75rem; border-bottom: 0.5px solid rgba(255,255,255,0.04); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    tr.clickable { cursor: pointer; }
    .mono { font-family: var(--mono); font-size: 0.82rem; }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em; }
    .badge-active { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .badge-banned  { background: rgba(239,68,68,0.12);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-admin   { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .badge-customer{ background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.1); }

    /* Pagination */
    .pagination { display: flex; gap: 0.5rem; align-items: center; margin-top: 1.25rem; font-size: 0.82rem; color: rgba(255,255,255,0.45); }
    .page-btn { padding: 0.35rem 0.7rem; border: 0.5px solid rgba(255,255,255,0.12); border-radius: 3px; background: transparent; color: rgba(255,255,255,0.55); font-family: inherit; font-size: 0.82rem; cursor: pointer; transition: all 0.15s; }
    .page-btn:hover:not(:disabled) { color: #fff; border-color: rgba(255,255,255,0.4); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { margin: 0 0.25rem; }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Пользователи</h1>
    </div>

    <div class="filters">
      <input type="search" id="f-search" class="filter-input" placeholder="Поиск по телефону, @username, имени…" style="width:280px" />
      <select id="f-role" class="filter-select">
        <option value="">Все роли</option>
        <option value="customer">customer</option>
        <option value="admin">admin</option>
      </select>
      <select id="f-status" class="filter-select">
        <option value="">Все статусы</option>
        <option value="active">Активен</option>
        <option value="banned">Заблокирован</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Телефон</th>
            <th>Имя / @username</th>
            <th>Роль</th>
            <th>Статус</th>
            <th>Заказов</th>
            <th>Потрачено</th>
            <th>Регистрация</th>
            <th>Вход</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="8" style="color:rgba(255,255,255,0.3);padding:1.5rem 0.75rem">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="page-btn" id="btn-prev" disabled>← Назад</button>
      <span class="page-info" id="page-info">—</span>
      <button class="page-btn" id="btn-next" disabled>Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/layout.js"></script>
  <script>LOOM_LAYOUT.init('users')</script>
  <script src="assets/users.js"></script>
</body>
</html>
