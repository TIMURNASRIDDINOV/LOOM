<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Клиенты — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=28" />
  <script src="assets/theme-init.js?v=28"></script>
  <style>
    .avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--hairline); display: block; }
  </style>
</head>
<body>
  <main class="page page--wide">
    <div class="page-head">
      <div>
        <h2 class="page-title">Клиенты</h2>
        <p class="page-sub">Все зарегистрированные покупатели. Нажмите на строку, чтобы открыть карточку клиента.</p>
      </div>
    </div>

    <div class="toolbar">
      <label class="sr-only" for="search-input">Поиск клиентов</label>
      <input id="search-input" type="search" class="input input--sm input--search" placeholder="Email, имя или телефон" />
      <button class="btn btn--sm" id="search-btn">Найти</button>
      <div class="toolbar-spacer"></div>
      <button class="btn btn--sm" id="refresh-btn">Обновить</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th style="width:3rem"><span class="sr-only">Аватар</span></th>
            <th>Контакт</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Роль</th>
            <th class="right">Заказов</th>
            <th>Регистрация</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="7"><div class="state">Загрузка…</div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <button class="btn btn--sm" id="prev-btn" disabled>← Назад</button>
      <button class="btn btn--sm" id="next-btn">Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js?v=28"></script>
  <script src="assets/ui.js?v=28"></script>
  <script src="assets/layout.js?v=28"></script>
  <script>LOOM_LAYOUT.init('users')</script>
  <script src="assets/users.js?v=28"></script>
</body>
</html>
