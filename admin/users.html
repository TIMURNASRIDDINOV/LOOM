<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пользователи — LOOM Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=6" />
  <script src="assets/theme-init.js?v=6"></script>
  <style>
    *, *::before, *::after { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    :root { --mono: 'DM Mono', monospace; }

    .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.5rem; font-weight: 300; letter-spacing: -0.02em; margin: 0; }

    /* Search */
    .search-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .search-input {
      padding: 0.55rem 0.9rem; border-radius: 3px;
      border: 0.5px solid var(--input-border);
      background: var(--input-bg); color: var(--text);
      font-family: inherit; font-size: 0.85rem; outline: none;
      width: 260px; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--input-border-focus); }
    .search-input::placeholder { color: var(--text-dim); }
    .btn-sm { padding: 0.5rem 0.9rem; border-radius: 3px; border: 0.5px solid var(--input-border); background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .btn-sm:hover { color: var(--text); border-color: var(--btn-hover-border); }

    /* Table */
    .card { background: var(--bg-card); border: 0.5px solid var(--hairline); border-radius: 4px; overflow: hidden; }
    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th { padding: 0.7rem 1rem; text-align: left; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 0.5px solid var(--hairline); white-space: nowrap; }
    .users-table td { padding: 0.7rem 1rem; font-size: 0.83rem; border-bottom: 0.5px solid var(--hairline2); vertical-align: middle; }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tbody tr:hover td { background: var(--hover-bg); }
    .mono { font-family: var(--mono); font-size: 0.78rem; }
    .muted { color: var(--muted); }
    .avatar-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--hairline); }
    .initials-sm { width: 28px; height: 28px; border-radius: 50%; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 600; color: var(--text-muted); flex-shrink: 0; }

    /* Pagination */
    .pagination { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; padding: 0 1rem; }
    .page-info { font-size: 0.78rem; color: var(--muted); flex: 1; }

    .loading-ph { color: var(--text-dim); font-size: 0.875rem; padding: 1rem; display: block; }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Пользователи</h1>
      <div class="search-row">
        <input id="search-input" class="search-input" placeholder="Email, имя или телефон…" />
        <button class="btn-sm" id="search-btn">Найти</button>
        <button class="btn-sm" id="refresh-btn">↺ Обновить</button>
      </div>
    </div>

    <div class="card">
      <table class="users-table">
        <thead>
          <tr>
            <th style="width:2.5rem">—</th>
            <th>Контакт</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Роль</th>
            <th>Заказов</th>
            <th>Дата регистрации</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="7"><span class="loading-ph">Загрузка…</span></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <button class="btn-sm" id="prev-btn">← Назад</button>
      <button class="btn-sm" id="next-btn">Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js?v=6"></script>
  <script src="assets/layout.js?v=8"></script>
  <script>LOOM_LAYOUT.init('users')</script>
  <script src="assets/users.js?v=6"></script>
</body>
</html>
