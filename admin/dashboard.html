<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LOOM Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    :root { --mono: 'DM Mono', monospace; --hairline: rgba(255,255,255,0.08); --muted: rgba(255,255,255,0.45); }

    .page { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-title { font-size: 1.5rem; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 1.75rem; }

    /* Stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.75rem; }
    @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .stat-grid { grid-template-columns: 1fr; } }
    .stat-card { background: #0f0f0f; border: 0.5px solid var(--hairline); border-radius: 4px; padding: 1.25rem 1.5rem; }
    .stat-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.5rem; }
    .stat-value { font-family: var(--mono); font-size: 1.5rem; font-weight: 400; color: #fff; margin: 0; }
    .stat-sub { font-size: 0.75rem; color: var(--muted); margin: 0.25rem 0 0; }

    /* Two-col grid */
    .two-col { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

    /* Card */
    .card { background: #0f0f0f; border: 0.5px solid var(--hairline); border-radius: 4px; padding: 1.5rem; }
    .card + .card { margin-top: 1.5rem; }
    .card-title { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.25rem; }

    /* Chart */
    .chart-wrap { position: relative; height: 200px; }

    /* Orders table */
    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table td { padding: 0.6rem 0; font-size: 0.85rem; border-bottom: 0.5px solid rgba(255,255,255,0.04); vertical-align: middle; }
    .mini-table tr:last-child td { border-bottom: none; }
    .mini-table .id-col { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); width: 3rem; }
    .mini-table .name-col { flex: 1; }
    .mini-table .arrow-col { width: 1.5rem; text-align: right; color: rgba(255,255,255,0.25); cursor: pointer; }
    .mini-table tr:hover .arrow-col { color: #fff; }
    .mini-table tr { cursor: pointer; transition: background 0.1s; }
    .mini-table tr:hover { background: rgba(255,255,255,0.02); }

    /* Status bar */
    .status-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .status-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; min-width: 64px; }
    .status-count { font-family: var(--mono); font-size: 1.1rem; }
    .status-lbl { font-size: 0.68rem; color: var(--muted); text-align: center; }

    .loading-ph { color: rgba(255,255,255,0.3); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="page-title">Dashboard</h1>

    <div class="stat-grid">
      <div class="stat-card">
        <p class="stat-label">Заказы за 7 дней</p>
        <p class="stat-value" id="stat-week">—</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Выручка за 30 дней</p>
        <p class="stat-value" id="stat-revenue">—</p>
        <p class="stat-sub">без отменённых</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Новых заказов</p>
        <p class="stat-value" id="stat-new">—</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">В производстве</p>
        <p class="stat-value" id="stat-producing">—</p>
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="card">
          <p class="card-title">Заказы за 30 дней</p>
          <div class="chart-wrap">
            <canvas id="orders-chart"></canvas>
          </div>
        </div>

        <div class="card">
          <p class="card-title">Статусы заказов</p>
          <div class="status-bar" id="status-bar">
            <span class="loading-ph">Загрузка…</span>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <p class="card-title">Последние заказы</p>
          <table class="mini-table" id="recent-orders">
            <tbody><tr><td class="loading-ph" colspan="3">Загрузка…</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <p class="card-title">Топ продуктов</p>
          <div id="top-products"><span class="loading-ph">Загрузка…</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/layout.js"></script>
  <script>LOOM_LAYOUT.init('dashboard')</script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
