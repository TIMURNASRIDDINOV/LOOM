<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Товары — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=23" />
  <script src="assets/theme-init.js?v=23"></script>
  <style>
    .thumb { width: 40px; height: 40px; border-radius: var(--radius-sm); object-fit: cover; background: var(--input-bg); border: 1px solid var(--hairline); display: block; }
    .thumb-placeholder {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      background: var(--bg-subtle); border: 1px dashed var(--hairline);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim);
    }
    .tag-ready {
      display: inline-block; margin-left: var(--sp-2);
      font-size: var(--fs-xs); padding: 1px 8px; border-radius: 999px;
      border: 1px solid var(--hairline); color: var(--text-muted); background: var(--hover-bg);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page page--wide">
    <div class="page-head">
      <div>
        <h2 class="page-title">Товары</h2>
        <p class="page-sub">Каталог магазина. Переключатель «Активен» сразу показывает или скрывает товар на сайте.</p>
      </div>
      <div class="page-actions">
        <a href="product-edit.html" class="btn btn--primary" data-cap="products.edit">+ Новый товар</a>
      </div>
    </div>

    <div class="toolbar">
      <label class="sr-only" for="filter-active">Фильтр по видимости</label>
      <select id="filter-active" class="select input--sm" style="min-width:180px">
        <option value="">Все товары</option>
        <option value="1">Только активные</option>
        <option value="0">Только скрытые</option>
      </select>
      <label class="sr-only" for="filter-q">Поиск товаров</label>
      <input id="filter-q" type="search" class="input input--sm input--search" placeholder="Название или slug" />
      <div class="toolbar-spacer"></div>
      <button id="btn-refresh" class="btn btn--sm">Обновить</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th style="width:56px"><span class="sr-only">Изображение</span></th>
            <th>Название</th>
            <th>Slug</th>
            <th class="right">Цена</th>
            <th>Активен</th>
            <th class="cell-actions"><span class="sr-only">Действия</span></th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6"><div class="state">Загрузка…</div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <button id="btn-prev" class="btn btn--sm" disabled>← Назад</button>
      <button id="btn-next" class="btn btn--sm">Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js?v=23"></script>
  <script src="assets/ui.js?v=23"></script>
  <script src="assets/layout.js?v=23"></script>
  <script>LOOM_LAYOUT.init('products')</script>
  <script src="assets/products.js?v=23"></script>
</body>
</html>
