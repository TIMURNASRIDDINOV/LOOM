<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Продукты — LOOM Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    :root { --mono: 'DM Mono', monospace; --hairline: rgba(255,255,255,0.08); --muted: rgba(255,255,255,0.45); }

    .page { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
    .page-title { font-size: 1.5rem; font-weight: 300; letter-spacing: -0.02em; margin: 0; }

    /* Controls */
    .controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .form-select, .form-input-sm {
      padding: 0.55rem 0.9rem; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: #fff; font-family: inherit; font-size: 0.85rem; outline: none;
    }
    .form-select { appearance: none; cursor: pointer; min-width: 140px; }
    .form-input-sm { min-width: 220px; }
    .form-input-sm::placeholder { color: rgba(255,255,255,0.3); }
    .form-select:focus, .form-input-sm:focus { border-color: rgba(255,255,255,0.4); }
    .form-select option { background: #1a1a1a; }

    .btn-sm { padding: 0.55rem 1rem; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-family: inherit; font-size: 0.82rem; cursor: pointer; transition: all 0.15s; }
    .btn-sm:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .btn-primary { padding: 0.55rem 1.1rem; border-radius: 4px; border: 0.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); color: #fff; font-family: inherit; font-size: 0.82rem; cursor: pointer; transition: all 0.15s; font-weight: 500; text-decoration: none; display: inline-block; }
    .btn-primary:hover { background: rgba(255,255,255,0.18); }

    /* Table */
    .table-wrap { border: 0.5px solid var(--hairline); border-radius: 4px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 0.75rem 1rem; text-align: left; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: #0a0a0a; border-bottom: 0.5px solid var(--hairline); white-space: nowrap; }
    tbody td { padding: 0.8rem 1rem; font-size: 0.875rem; border-bottom: 0.5px solid rgba(255,255,255,0.04); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { background: #0f0f0f; }

    /* Thumbnail */
    .thumb { width: 40px; height: 40px; border-radius: 3px; object-fit: cover; background: rgba(255,255,255,0.05); border: 0.5px solid var(--hairline); display: block; }
    .thumb-placeholder { width: 40px; height: 40px; border-radius: 3px; background: rgba(255,255,255,0.04); border: 0.5px solid var(--hairline); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: rgba(255,255,255,0.2); }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 20px; cursor: pointer; transition: background 0.2s; border: 0.5px solid rgba(255,255,255,0.15); }
    .toggle-slider::before { content: ''; position: absolute; height: 14px; width: 14px; left: 2px; top: 2px; background: rgba(255,255,255,0.5); border-radius: 50%; transition: transform 0.2s, background 0.2s; }
    .toggle input:checked + .toggle-slider { background: rgba(34,197,94,0.25); border-color: rgba(34,197,94,0.5); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: #22c55e; }

    /* Action buttons */
    .action-btn { padding: 0.3rem 0.65rem; border-radius: 3px; border: 0.5px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.5); font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    .action-btn:hover { color: #fff; border-color: rgba(255,255,255,0.35); }
    .action-btn.danger:hover { color: #ef4444; border-color: rgba(239,68,68,0.4); }

    /* Pagination */
    .pagination { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; justify-content: flex-end; }
    .page-info { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Продукты</h1>
      <a href="product-edit.html" class="btn-primary">+ Новый продукт</a>
    </div>

    <div class="controls">
      <select id="filter-active" class="form-select">
        <option value="">Все</option>
        <option value="1">Активные</option>
        <option value="0">Неактивные</option>
      </select>
      <input id="filter-q" type="text" class="form-input-sm" placeholder="Поиск по slug или названию…" />
      <button id="btn-refresh" class="btn-sm">↻ Обновить</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:52px"></th>
            <th>Slug</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Активен</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6" style="text-align:center;padding:2rem;color:rgba(255,255,255,0.35)">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="btn-prev" class="btn-sm" disabled>← Назад</button>
      <span class="page-info" id="page-info"></span>
      <button id="btn-next" class="btn-sm">Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/layout.js?v=2"></script>
  <script>LOOM_LAYOUT.init('products')</script>
  <script src="assets/products.js"></script>
</body>
</html>
