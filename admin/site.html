<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная страница — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=30" />
  <script src="assets/theme-init.js?v=30"></script>
  <style>
    .hero-preview { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
    .hero-preview figure { margin: 0; aspect-ratio: 1; border: 1px solid var(--hairline); border-radius: var(--radius); background: #fff; overflow: hidden; }
    .hero-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    @media (max-width: 640px) { .hero-preview { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-head">
      <div>
        <h2 class="page-title">Главная страница</h2>
        <p class="page-sub">Большая картинка справа от заголовка на loomdesign.uz. Новая картинка появляется на сайте в течение минуты, без выпуска кода.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h3 class="card-title">Картинка на главной</h3>
          <p class="card-sub" id="hero-status" aria-live="polite">Загрузка…</p>
        </div>
      </div>

      <div class="hero-preview">
        <figure><img id="hero-img" src="/images/home/hero-tee-v1.webp" alt="Текущая картинка на главной" width="1200" height="1200" /></figure>

        <form id="hero-form">
          <div class="field">
            <label class="field-label" for="hero-file">Новая картинка</label>
            <input id="hero-file" name="image" class="input" type="file" accept="image/png,image/jpeg,image/webp" required />
            <span class="field-hint">PNG, JPEG или WebP, до 3 МБ. Лучше квадрат 1200×1200 на белом фоне: картинка вписывается в квадрат целиком.</span>
          </div>
          <div class="field">
            <label class="field-label" for="hero-alt">Описание для незрячих (необязательно)</label>
            <input id="hero-alt" name="alt" class="input" type="text" maxlength="200" autocomplete="off" placeholder="Например, худи LOOM с принтом сюзане…" />
          </div>
          <p class="field-error" id="hero-err" role="alert"></p>
          <div class="card-foot">
            <button type="button" class="btn btn--ghost" id="hero-reset" hidden>Вернуть стандартную</button>
            <button type="submit" class="btn btn--primary" id="hero-save">Сохранить картинку</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/app.js?v=31"></script>
  <script src="assets/ui.js?v=31"></script>
  <script src="assets/layout.js?v=32"></script>
  <script>LOOM_LAYOUT.init('site')</script>
  <script src="assets/site.js?v=1"></script>
</body>
</html>
