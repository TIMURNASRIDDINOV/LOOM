<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LOOM Admin</title>
  <link rel="stylesheet" href="assets/theme.css?v=6" />
  <script src="assets/theme-init.js?v=6"></script>
  <style>body{margin:0;background:var(--bg);}</style>
  <script>
    // Redirect based on auth state
    ;(async function () {
      try {
        const res = await fetch(
          (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            ? 'http://localhost:8787'
            : 'https://api.loomdesign.uz') + '/api/admin/me',
          { credentials: 'include' }
        )
        location.href = res.ok ? 'dashboard.html' : 'login.html'
      } catch {
        location.href = 'login.html'
      }
    })()
  </script>
</head>
<body></body>
</html>
