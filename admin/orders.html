<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заказы — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=18" />
  <script src="assets/theme-init.js?v=18"></script>
</head>
<body>
  <main class="page page--wide">
    <div class="page-head">
      <div>
        <h2 class="page-title">Заказы</h2>
        <p class="page-sub">Все заказы магазина. Нажмите на строку, чтобы открыть карточку заказа.</p>
      </div>
    </div>

    <div class="toolbar">
      <label class="sr-only" for="filter-status">Фильтр по статусу</label>
      <select id="filter-status" class="select input--sm" style="min-width:180px">
        <option value="">Все статусы</option>
        <option value="new">Новый</option>
        <option value="confirmed">Подтверждён</option>
        <option value="producing">Производство</option>
        <option value="shipped">Отправлен</option>
        <option value="delivered">Доставлен</option>
        <option value="cancelled">Отменён</option>
      </select>
      <label class="sr-only" for="filter-q">Поиск</label>
      <input id="filter-q" type="search" class="input input--sm input--search" placeholder="Имя клиента или телефон" />
      <div class="toolbar-spacer"></div>
      <button id="btn-refresh" class="btn btn--sm">Обновить</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>№</th>
            <th>Клиент</th>
            <th>Телефон</th>
            <th>Продукт</th>
            <th class="right">Сумма</th>
            <th>Статус</th>
            <th>Дата</th>
            <th><span class="sr-only">Открыть</span></th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr><td colspan="8"><div class="state">Загрузка…</div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <button id="btn-prev" class="btn btn--sm" disabled>← Назад</button>
      <button id="btn-next" class="btn btn--sm">Вперёд →</button>
    </div>
  </main>

  <script src="assets/app.js?v=18"></script>
  <script src="assets/ui.js?v=18"></script>
  <script src="assets/layout.js?v=18"></script>
  <script>LOOM_LAYOUT.init('orders')</script>
  <script src="assets/orders.js?v=18"></script>
</body>
</html>
