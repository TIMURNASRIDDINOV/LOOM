<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=30" />
  <script src="assets/theme-init.js?v=30"></script>
  <style>
    .ig-switch { align-items: center; margin-bottom: var(--sp-6); }
    .ig-switch-text { flex: 1; min-width: 0; }
    .ig-switch-title { font-weight: 600; margin: 0; }
    .ig-switch-sub { font-size: var(--fs-sm); color: var(--text-muted); margin: 2px 0 0; }
    .ig-switch .switch-row { padding: var(--sp-2); align-items: center; }
    .ig-group { margin-bottom: var(--sp-6); }
    .ig-group-title { font-size: var(--fs-md); font-weight: 600; margin: 0 0 var(--sp-3); }
    .ig-group-title .count { color: var(--text-muted); font-weight: 400; }
    .ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-4); }
    .ig-card { display: flex; flex-direction: column; overflow: hidden; }
    .ig-thumb { position: relative; aspect-ratio: 1; background: var(--hover-bg); border-bottom: 1px solid var(--hairline); }
    .ig-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ig-thumb .badge { position: absolute; top: var(--sp-2); left: var(--sp-2); }
    .ig-thumb .ig-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: var(--fs-sm); }
    .ig-body { padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .ig-when { font-family: var(--mono); font-size: var(--fs-sm); color: var(--text-secondary); }
    .ig-line { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ig-meta { color: var(--text-muted); font-size: var(--fs-sm); }
    .ig-note { font-size: var(--fs-sm); color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: var(--radius-sm); padding: 6px 8px; margin: 0; word-break: break-word; }
    .ig-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--hairline); }
    .ig-actions .ig-note { flex-basis: 100%; }
    .badge-draft     { background: var(--hover-bg);   color: var(--text-secondary); border-color: var(--hairline); }
    .badge-approved, .badge-publishing { background: var(--warning-bg); color: var(--warning); border-color: var(--warning-border); }
    .badge-published { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .badge-failed, .badge-rejected { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .dialog.ig-editor { max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .ig-lang { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
    .ig-lang label { font-size: var(--fs-sm); color: var(--text-muted); }
    .ig-editor .textarea { min-height: 84px; }
    .ig-counter { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-family: var(--mono); font-size: var(--fs-sm); color: var(--text-secondary); margin-bottom: var(--sp-4); }
    .ig-counter .is-over { color: var(--danger); font-weight: 600; }
    .ig-slots { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
    .ig-slots[hidden] { display: none; }
    .ig-preview { max-width: 200px; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--hairline); border-radius: var(--radius-sm); display: block; margin-top: var(--sp-2); }
  </style>
</head>
<body>
  <main class="page page--wide">
    <div class="page-head">
      <div>
        <h2 class="page-title">Instagram</h2>
        <p class="page-sub">Посты для loom_uz. Публикуется только одобренный пост и только когда публикация включена. Время — по Ташкенту.</p>
      </div>
      <button type="button" class="btn btn--primary" id="new-btn">Новый пост</button>
    </div>

    <div class="notice ig-switch" id="ig-switch" aria-live="polite">
      <div class="ig-switch-text">
        <p class="ig-switch-title" id="switch-title">Загрузка настроек…</p>
        <p class="ig-switch-sub" id="switch-sub"></p>
      </div>
      <label class="switch-row" data-cap="instagram.approve">
        <span class="switch-text"><span class="switch-label">Публикация</span></span>
        <span class="switch"><input type="checkbox" id="switch-input" disabled /><span class="track"></span><span class="knob"></span></span>
      </label>
    </div>

    <div class="toolbar">
      <span class="page-info" id="page-info"></span>
      <div class="toolbar-spacer"></div>
      <button class="btn btn--sm" id="refresh-btn">Обновить</button>
    </div>

    <div id="ig-groups"><div class="state">Загрузка…</div></div>
  </main>

  <script src="assets/app.js?v=31"></script>
  <script src="assets/ui.js?v=31"></script>
  <script src="assets/layout.js?v=31"></script>
  <script>LOOM_LAYOUT.init('instagram')</script>
  <script src="assets/instagram.js?v=2"></script>
</body>
</html>
