<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — LOOM Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=5" />
  <script src="assets/theme-init.js?v=5"></script>
  <style>
    *, *::before, *::after { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    :root { --mono: 'DM Mono', monospace; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--bg-card); border: 0.5px solid var(--hairline); border-radius: 8px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-card); }
    .brand { font-family: var(--mono); font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); text-align: center; margin: 0 0 2rem; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .form-input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 4px;
      border: 0.5px solid var(--input-border); background: var(--input-bg);
      color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none;
      transition: border-color 200ms;
    }
    .form-input::placeholder { color: var(--text-dim); }
    .form-input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--hairline2); }
    .btn-submit {
      width: 100%; padding: 0.85rem; border-radius: 2px; border: 1px solid var(--invert-bg);
      background: var(--invert-bg); color: var(--invert-text); font-family: inherit; font-size: 0.82rem;
      font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; margin-top: 1.5rem; transition: background 0.2s, color 0.2s;
    }
    .btn-submit:hover:not(:disabled) { background: transparent; color: var(--text); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: var(--danger); font-size: 0.82rem; margin-top: 0.75rem; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">LOOM / Admin</p>
    <form id="login-form">
      <div style="margin-bottom:1rem">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-input" placeholder="admin@loomdesign.uz" required autocomplete="username" />
      </div>
      <div>
        <label class="form-label" for="password">Пароль</label>
        <input id="password" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <p class="error-msg" id="error-msg"></p>
      <button type="submit" class="btn-submit" id="btn-submit">Войти</button>
    </form>
  </div>

  <script src="assets/app.js?v=5"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn-submit')
      const errEl = document.getElementById('error-msg')
      btn.disabled = true
      btn.textContent = 'Вход…'
      errEl.textContent = ''

      try {
        await window.LOOM.apiJSON('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        })
        window.location.href = 'orders.html'
      } catch (err) {
        errEl.textContent = err.message || 'Ошибка входа'
        btn.disabled = false
        btn.textContent = 'Войти'
      }
    })
  </script>
</body>
</html>
