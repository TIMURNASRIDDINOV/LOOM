<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon (pencil mark) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — LOOM Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css?v=30" />
  <script src="assets/theme-init.js?v=30"></script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-4); }
    .login-card { width: 100%; max-width: 420px; padding: var(--sp-6); }
    .brand {
      font-family: var(--mono); font-size: var(--fs-base); letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text); text-align: center; margin: 0 0 var(--sp-2);
    }
    .brand-sub { text-align: center; color: var(--text-muted); font-size: var(--fs-base); margin: 0 0 var(--sp-6); }
  </style>
</head>
<body>
  <div class="card login-card">
    <p class="brand">LOOM</p>
    <p class="brand-sub">Панель управления магазином</p>

    <form id="login-form">
      <div class="field">
        <label class="field-label" for="email">Рабочий email</label>
        <input id="email" type="email" class="input" placeholder="admin@loomdesign.uz" required autocomplete="username" />
      </div>
      <div class="field">
        <label class="field-label" for="password">Пароль</label>
        <input id="password" type="password" class="input" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <p class="field-error" id="error-msg" role="alert" style="min-height:1.2em"></p>
      <button type="submit" class="btn btn--primary btn--block" id="btn-submit" style="margin-top:var(--sp-2)">Войти</button>
    </form>

    <p class="field-hint" style="text-align:center;margin-top:var(--sp-5)">
      Забыли пароль? Обратитесь к владельцу аккаунта — он может создать новый доступ.
    </p>
  </div>

  <script src="assets/app.js?v=30"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn-submit')
      const errEl = document.getElementById('error-msg')
      btn.disabled = true
      btn.textContent = 'Вход…'
      errEl.textContent = ''

      try {
        await window.LOOM.apiJSON('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        })
        // Every admin can reach the orders list if they can reach anything;
        // the shell redirects onwards if this admin's capabilities say otherwise.
        window.location.href = 'orders.html'
      } catch (err) {
        errEl.textContent = err.status === 401
          ? 'Неверный email или пароль'
          : (err.message || 'Не удалось войти')
        btn.disabled = false
        btn.textContent = 'Войти'
      }
    })
  </script>
</body>
</html>
