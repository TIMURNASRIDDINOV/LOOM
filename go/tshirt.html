<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <!-- LOOM-371: Instagram ad landing. Every visitor (people and crawlers)
       gets this same page; the button opens the Telegram Mini App on the
       t-shirt configurator (start_param routing: assets/tma.js). No automatic
       redirect: Meta rejects ads whose landing page redirects (LOOM-372). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>LOOM — Futbolkangizni Telegram'da yarating</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/atelye.css?v=6" />
  <style>
    main { min-height: 100dvh; max-width: 440px; margin: 0 auto; padding: calc(20px + var(--atl-st)) 16px calc(24px + var(--atl-sb)); display: flex; flex-direction: column; gap: 20px; }
    .go-art { flex: 1 1 auto; min-height: 220px; border-radius: var(--r-panel); display: grid; place-items: center; overflow: hidden; }
    .go-art img { width: 78%; max-width: 340px; height: auto; }
    .go-btn { height: 56px; font-size: 16px; }
    .go-alt { align-self: center; color: var(--mut); }
  </style>
</head>
<body>
  <main>
    <span class="atl-wm" aria-label="LOOM">LOOM<i></i></span>
    <div class="atl-cv go-art" aria-hidden="true">
      <img src="/images/home/hero-tee-v1.webp" alt="" width="1200" height="1200" decoding="async" fetchpriority="high">
    </div>
    <h1 class="atl-t1">Futbolkangizni Telegram'da yarating</h1>
    <a id="go" class="atl-btn atl-btn-p atl-btn-w go-btn" href="https://t.me/looom_design_bot?startapp=tshirt-regular__reel_print_nov26_bot">Telegram'da ochish</a>
    <a id="web" class="atl-lnk go-alt" href="/configurator?slug=tshirt-regular">Saytda davom etish</a>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search)
      // start_param allows A-Za-z0-9_- up to 64 chars; "tshirt-regular__" uses 16.
      var c = q.get('utm_campaign') || ''
      if (!/^[A-Za-z0-9_-]{1,48}$/.test(c)) c = 'reel_print_nov26_bot'
      document.getElementById('go').href = 'https://t.me/looom_design_bot?startapp=tshirt-regular__' + c
      // Keep the ad's UTM tags on the website fallback.
      var w = new URLSearchParams({ slug: 'tshirt-regular' })
      q.forEach(function (v, k) { if (/^utm_/.test(k)) w.set(k, v) })
      document.getElementById('web').href = '/configurator?' + w.toString()
    })()
  </script>
</body>
</html>
