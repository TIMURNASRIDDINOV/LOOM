<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Pages serves this file for every missing path, also nested ones
       (/a/b/c): every relative URL here and in shell.js resolves from /. -->
  <base href="/" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f2" />
  <meta name="robots" content="noindex, follow" />
  <title>LOOM — 404</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/atelye.css?v=5" />
  <script src="assets/boot.js?v=10"></script>
  <style>
    .atl-nf-code { font: 800 34px/1 var(--f); font-stretch: 125%; }
    .atl-nf .atl-btns { width: 100%; max-width: 420px; }
    .atl-nf-art { display: none; }
    /* Desktop (LOOM-333): text left, the garment with a torn seam right;
       header and footer stay so the visitor can move on. */
    @media (min-width: 900px) {
      main.atl-nf-page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; min-height: 520px; }
      .atl-nf { align-items: flex-start; text-align: left; padding: 0; gap: 20px; }
      .atl-nf .atl-cv { width: auto; height: auto; padding: 4px 10px; border-radius: 4px; background: var(--surface2); }
      .atl-nf-code { font-size: 13px; font-weight: 700; font-stretch: 100%; }
      .atl-nf .atl-lead { margin: 0; font-size: 18px; }
      .atl-nf .atl-btns { max-width: none; }
      .atl-nf .atl-btns > * { flex: none; padding: 0 22px; }
      .atl-nf-art { display: grid; place-items: center; position: relative; height: 440px; border-radius: var(--r-panel); }
      .atl-nf-art img, .atl-nf-art svg { position: absolute; width: 52%; height: auto; }
    }
  </style>
</head>
<body data-page="404" data-no-nav data-no-footer="phone">
  <main class="atl-wrap atl-nf-page">
    <div class="atl-empty atl-center atl-nf">
      <span class="atl-cv" aria-hidden="true"><span class="atl-nf-code">404</span></span>
      <h1 class="atl-t1" data-i18n="atl.nf.title">Sahifa so‘kilib ketdi.</h1>
      <p class="atl-lead" data-i18n="atl.nf.lead">Bunday sahifa yo‘q — u olib tashlangan bo‘lishi yoki havolada xato bo‘lishi mumkin. Konstruktor esa joyida.</p>
      <div class="atl-btns">
        <a class="atl-btn atl-btn-p" href="configurator.html" data-tma-main data-i18n="atl.nav.create">Dizayn yaratish</a>
        <a class="atl-btn" href="index.html" data-i18n="atl.nav.home">Bosh sahifa</a>
        <a class="atl-btn" href="catalog.html" data-i18n="atl.nav.catalog">Katalog</a>
      </div>
    </div>
    <div class="atl-cv atl-nf-art" aria-hidden="true">
      <img src="configuratorprodutcs/tshirt_flat_white_600.png" alt="" width="600" height="600" decoding="async">
      <svg viewBox="0 0 300 300"><path d="M150 95l-8 20 10 18-12 22 8 20" fill="none" stroke="#d93529" stroke-width="3" stroke-dasharray="6 5"/></svg>
    </div>
  </main>

  <script src="assets/config.js?v=11"></script>
  <script src="assets/i18n.js?v=63"></script>
  <script src="assets/auth.js?v=6"></script>
  <script src="assets/tma.js?v=5"></script>
  <script src="assets/shell.js?v=4"></script>
  <script src="assets/analytics.js?v=4"></script>
</body>
</html>
