<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>LOOM — Dizayner</title>
  <meta name="description" content="Страница дизайнера LOOM: его принты, которые можно примерить на своей вещи." />
  <link rel="canonical" href="https://loomdesign.uz/designer" />
  <!-- One page per designer, generated from a query string: not worth
       indexing on its own. -->
  <meta name="robots" content="noindex, follow" />
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="LOOM" />
  <meta property="og:title" content="LOOM — Дизайнер" />
  <meta property="og:image" content="https://loomdesign.uz/images/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/atelye.css?v=6" />
  <script src="assets/boot.js?v=11"></script>
  <style>
    /* Designer profile only. Components come from assets/atelye.css. */
    .atl-dz-id { display: flex; gap: 14px; align-items: center; min-width: 0; }
    .atl-dz-id > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .atl-dz-head { display: flex; flex-direction: column; gap: 14px; }
    /* Print card: the art and title open the print in the configurator;
       the author link sits outside the button (no nested controls). */
    .atl-mk-try { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; text-align: left; border-radius: var(--r-panel); }
    .atl-mk-try:hover .atl-pc-nm { text-decoration: underline; text-underline-offset: 3px; }
    .atl-mk-try .atl-gtile { padding: 16%; }
    .atl-mk-skl { height: 14px; width: 70%; }
    .atl-mk-none { grid-column: 1 / -1; }
    @media (min-width: 900px) {
      .atl-dz-id { gap: 24px; }
      .atl-dz-id .atl-avatar { width: 96px; height: 96px; font-size: 30px; }
      #dz-handle { font-size: 42px; line-height: 1.05; font-stretch: 118%; }
      #dz-bio { font-size: 18px; }
    }
  </style>
</head>
<body data-page="designer" data-title="Dizayner" data-back="designers.html">
  <main class="atl-wrap">
    <div class="atl-dz-head" id="dz-head">
      <div class="atl-dz-id">
        <span class="atl-avatar" id="dz-av" aria-hidden="true"></span>
        <div>
          <h1 class="atl-t2" id="dz-handle"><span class="atl-skel atl-mk-skl"></span></h1>
          <p class="atl-sm" id="dz-meta"></p>
        </div>
      </div>
      <p class="atl-lead" id="dz-bio" hidden></p>
    </div>

    <!-- Prints from GET /api/designers/:handle (assets/market.js). -->
    <div class="atl-pgrid" id="dz-grid" aria-live="polite"></div>

    <div class="atl-empty" id="dz-missing" hidden>
      <span class="atl-cv" aria-hidden="true"><svg class="atl-ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
      <h2 class="atl-t2" data-i18n="mk.notFound">Dizayner topilmadi</h2>
      <div class="atl-btns">
        <a class="atl-btn atl-btn-g" href="designers.html" data-i18n="atl.nav.designers">Dizaynerlar</a>
        <a class="atl-btn" href="market.html" data-i18n="atl.home.toMarket">Marketga</a>
      </div>
    </div>
  </main>

  <script src="assets/config.js?v=11"></script>
  <script src="assets/i18n.js?v=66"></script>
  <script src="assets/auth.js?v=7"></script>
  <script src="assets/sheet-drag.js?v=1"></script>
  <script src="assets/tma.js?v=7"></script>
  <script src="assets/shell.js?v=5"></script>
  <script src="assets/market.js?v=6"></script>
  <script src="assets/track.js?v=6"></script>
  <script src="assets/analytics.js?v=5"></script>
</body>
</html>
