<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- The authorization code rides in this URL; never hand it to a third party
       through a Referer header. -->
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2ed" />
  <title>LOOM — Вход</title>
  <link rel="stylesheet" href="/assets/theme.css?v=12" />
  <link rel="stylesheet" href="/assets/oauth.css?v=1" />
  <script src="/assets/boot.js?v=8"></script>

  <script defer src="/assets/config.js?v=2"></script>
  <script defer src="/assets/i18n.js?v=21"></script>
  <script defer src="/assets/auth.js?v=4"></script>
  <script defer src="/assets/oauth.js?v=1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body, sans-serif); -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="oauth-callback">

  <!-- The whole page is a waiting room: oauth.js redeems the code with the
       Worker, then forwards to wherever sign-in was started from. -->
  <main class="oauth-callback__box">
    <div class="oauth-callback__spinner" id="cbSpinner"></div>
    <h1 class="oauth-callback__title" id="cbTitle" data-i18n="auth.oauthWorking">Завершаем вход…</h1>
    <p class="oauth-callback__sub" id="cbSub" data-i18n="auth.oauthWorkingSub">Секунду — подтверждаем ваш профиль.</p>
    <a class="oauth-callback__link" id="cbBack" href="/login.html" hidden data-i18n="auth.oauthBackToLogin">← Вернуться ко входу</a>
  </main>

  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
      var T = function (k, fb) {
        try { return (window.LOOM_I18N ? window.LOOM_I18N.t(k) : fb) || fb; } catch (e) { return fb; }
      };

      window.LOOM_OAUTH.complete().then(function (next) {
        // replace() so Back does not land on a spent authorization code.
        window.location.replace(next);
      }).catch(function (err) {
        document.getElementById('cbSpinner').hidden = true;
        var title = document.getElementById('cbTitle');
        var sub   = document.getElementById('cbSub');
        var back  = document.getElementById('cbBack');
        title.removeAttribute('data-i18n');
        sub.removeAttribute('data-i18n');
        title.textContent = T('auth.oauthFailedTitle', 'Не удалось войти');
        sub.textContent   = err && err.message ? err.message : T('auth.oauthFailed', 'Не удалось войти через этот сервис');
        back.hidden = false;
      });
    });
  </script>
</body>
</html>
